// ── HUD helpers ──
let bannerT = 0;
function showBanner(html, secs = 2) { $('banner').innerHTML = html; $('banner').classList.add('show'); bannerT = secs; }
function addFeed(html) {
  const el = document.createElement('div');
  el.innerHTML = html;
  $('feed').prepend(el);
  setTimeout(() => el.remove(), 5000);
  while ($('feed').children.length > 5) $('feed').lastChild.remove();
}
const teamSpan = (id) => `<span class="${remoteTeam(id)}">${remoteName(id)}</span>`;
const TEAM_KO = { blue: '블루', red: '레드' };
let hurtT = 0;

function spawnLocal(s) {
  player.position.set(s[0], getGroundHeight(s[0], s[1]), s[1]);
  player.velocity.set(0, 0, 0);
  player.isGrounded = true;
  cam.yaw = s[2]; cam.pitch = 0;
  recoil.pitch = recoil.yaw = recoil.pendPitch = recoil.pendYaw = 0;
  player.hp = 100; player.dead = false;
  player.isDodging = false;
  weapon.ammo = WEAPON.magSize; weapon.reloading = 0; weapon.spray = 0;
  knifeState.anim = null;
  $('dead-msg').style.display = 'none';
}

function onNetMessage(m) {
  switch (m.t) {
    case 'welcome': net.id = m.id; break;
    case 'error':
      if (net.mode === 'lobby') $('lobby-msg').textContent = m.msg; else $('menu-error').textContent = m.msg;
      break;
    case 'lobby':
      net.room = m.room; net.roomMode = m.mode; net.roomType = m.type || 'elim'; net.host = m.host; net.players = m.players;
      net.myTeam = (m.players.find(p => p.id === net.id) || {}).team || net.myTeam;
      if (net.mode === 'menu' || net.mode === 'lobby') enterLobby();
      if (net.mode === 'lobby') renderLobby();
      else syncRemotes();
      break;
    case 'round':
      net.phase = m.phase; net.round = m.round; net.score = m.score; net.timer = m.timer;
      if (m.phase === 'prestart') {
        if (net.mode !== 'online') startOnlineMatch();
        net.type = m.type || 'elim'; net.attack = m.attack || null; net.bomb = null; net.act = null;
        boomT = 0; boomBall.visible = false;
        if (m.map && m.map !== currentMap) loadMap(m.map);   // before spawning: ground height depends on the map
        if (m.spawns && m.spawns[net.id]) spawnLocal(m.spawns[net.id]);
        for (const r of net.remotes.values()) { r.dead = false; r.hp = 100; r.buf.length = 0; r.avatar.userData.dead = false; r.avatar.rotation.x = 0; }
        const role = net.type !== 'bomb' ? '' : net.myTeam === net.attack ? ' · 공격 — 폭탄을 A나 B에 설치하세요' : ' · 수비 — A, B 사이트를 지키세요';
        showBanner(`ROUND ${m.round}<small>${TEAM_KO.blue} ${m.score.blue} : ${m.score.red} ${TEAM_KO.red}${role}</small>`, 2.5);
      } else if (m.phase === 'live') {
        showBanner('시작!', 0.8);
      } else if (m.phase === 'post') {
        const txt = !m.winner ? '무승부' : m.winner === net.myTeam ? '라운드 승리' : '라운드 패배';
        const why = { time: ' · 시간 종료', bomb: ' · 폭탄 폭발', defuse: ' · 폭탄 해체' }[m.reason] || '';
        showBanner(`${txt}<small>${TEAM_KO.blue} ${m.score.blue} : ${m.score.red} ${TEAM_KO.red}${why}</small>`, 2.8);
      }
      break;
    case 'snap':
      net.timer = m.timer; net.phase = m.phase; net.bomb = m.bomb || null;
      for (const s of m.ps) {
        if (s.id === net.id) {
          player.hp = s.hp;
          if (s.dead && !player.dead) { player.dead = true; $('dead-msg').style.display = 'block'; }
          continue;
        }
        const r = net.remotes.get(s.id);
        if (!r) continue;
        r.hp = s.hp; r.dead = s.dead;
        r.buf.push({ time: performance.now() / 1000, p: s.p, yaw: s.yaw, pitch: s.pitch, w: s.w });
        if (r.buf.length > 20) r.buf.shift();
      }
      break;
    case 'hp':
      if (m.id === net.id) {
        player.hp = m.hp;
        hurtT = 0.5;
      }
      break;
    case 'kill': {
      const icon = m.w === 'knife' ? '🔪' : (m.head ? '🎯' : '▶');
      addFeed(`${teamSpan(m.killer)} ${icon} ${teamSpan(m.victim)}`);
      if (m.victim === net.id) { player.dead = true; $('dead-msg').style.display = 'block'; }
      if (m.killer === net.id) showKill(m.w === 'knife' ? 'KNIFED' : m.head ? 'HEADSHOT' : 'ELIMINATED');
      const r = net.remotes.get(m.victim);
      if (r) { r.dead = true; r.avatar.userData.dead = true; r.avatar.userData.deadT = 0; }
      break;
    }
    case 'shot': {
      const r = net.remotes.get(m.id);
      if (!r) break;
      r.avatar.userData.flashT = 0.05;
      if (Array.isArray(m.o) && Array.isArray(m.e)) addTracer(m.o, m.e);
      const dist = r.avatar.position.distanceTo(player.position);
      SFX.play('shots', { vol: 0.5 * Math.max(0.12, 1 - dist / 70), jitter: 0.04 });
      break;
    }
    case 'anim': {
      const r = net.remotes.get(m.id);
      if (r) r.avatar.userData.swingT = 0.35;
      break;
    }
    case 'bomb':
      if (m.ev === 'plant') {
        addFeed(`${teamSpan(m.id)} 💣 ${m.site || ''} 설치`);
        showBanner(`폭탄 설치됨 — ${m.site || ''} 사이트!`, 1.5);
        SFX.tone(1200, 0.12, 0.2); SFX.tone(1600, 0.15, 0.2, 0.12);
        bombBeepT = 0;
      } else if (m.ev === 'defuse') {
        addFeed(`${teamSpan(m.id)} ✂ 폭탄 해체`);
        SFX.tone(700, 0.1, 0.2, 0, 'triangle'); SFX.tone(500, 0.2, 0.2, 0.1, 'triangle');
      } else if (m.ev === 'drop') {
        addFeed(`${teamSpan(m.id)} 폭탄 떨어뜨림`);
      } else if (m.ev === 'pickup') {
        addFeed(`${teamSpan(m.id)} 폭탄 주움`);
        if (m.id === net.id) SFX.play('cloth1', { vol: 0.5 });
      } else if (m.ev === 'explode') {
        explodeBomb(m.p);
      }
      break;
    case 'left':
      net.players = net.players.filter(p => p.id !== m.id);
      if (net.remotes.has(m.id)) { addFeed(`${teamSpan(m.id)} 나감`); scene.remove(net.remotes.get(m.id).avatar); net.remotes.delete(m.id); syncRemotes(); }
      break;
    case 'end': {
      const win = m.winner === net.myTeam;
      showBanner(`${win ? '승리!' : '패배'}<small>${TEAM_KO.blue} ${m.score.blue} : ${m.score.red} ${TEAM_KO.red}</small>`, 4);
      setTimeout(() => { if (net.mode === 'online') { net.mode = 'lobby'; clearRemotes(); resetBombMode(); dummies.length = 0; enterLobby(); renderLobby(); } }, 4000);
      break;
    }
  }
}

// paper tracer from another player's gun to where their bullet landed
const tracers = [];
const tracerMat = new THREE.LineBasicMaterial({ color: 0xfff6c8, transparent: true, opacity: 0.9 });
function addTracer(o, e) {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...o), new THREE.Vector3(...e)]);
  const line = new THREE.Line(geo, tracerMat.clone());
  scene.add(line);
  tracers.push({ line, t: 0.08 });
}

// local hooks used by shooting/knife code
function reportShot(origin, end) {
  if (net.mode === 'online') netSend({ t: 'shot', o: origin.toArray().map(v => +v.toFixed(2)), e: end.toArray().map(v => +v.toFixed(2)) });
}
// returns true if the hit is handled online (server applies damage) — local HP is not touched
function reportHit(dummy, dmg, head, w) {
  if (net.mode !== 'online' || !dummy.userData.remoteId) return false;
  if (dummy.userData.team !== net.myTeam && net.phase === 'live') {
    netSend({ t: 'hit', target: dummy.userData.remoteId, dmg, head, w });
    showHitmarker(head);
  }
  return true;
}
// frozen during the round countdown, while dead, and while planting/defusing
const playerCanAct = () => net.mode !== 'online' || (net.phase === 'live' || net.phase === 'post') && !player.dead && !net.act;

// ── bomb: paper C4 with a blinking light, shown dropped / planted / on the carrier's back ──
const bombModel = new THREE.Group();
part(bombModel, 0.42, 0.16, 0.28, 0x6b5a3e, 0, 0.08, 0);
part(bombModel, 0.2, 0.03, 0.14, 0x2e2c2a, -0.06, 0.175, 0);
const bombLight = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshBasicMaterial({ color: 0x551111 }));
bombLight.position.set(0.12, 0.18, 0.06);
bombModel.add(bombLight);
bombModel.traverse(o => { o.raycast = () => {}; });
bombModel.visible = false;
scene.add(bombModel);
let bombBeepT = 0, bombBlinkT = 0;
// explosion: growing paper fireball + white flash + boom
const boomBall = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true }));
boomBall.visible = false;
boomBall.raycast = () => {};
scene.add(boomBall);
let boomT = 0;
function explodeBomb(p) {
  if (Array.isArray(p)) boomBall.position.set(p[0], 0.5, p[2]);
  boomBall.visible = true;
  boomT = 1.4;
  bombModel.visible = false;
  const dist = boomBall.position.distanceTo(player.position);
  SFX.boom(Math.max(0.35, 1 - dist / 60));
  $('boom-flash').style.opacity = Math.max(0.25, 1 - dist / 40).toFixed(2);
}
// what holding E would do right now (null if nothing)
function bombAction() {
  const b = net.bomb;
  if (net.type !== 'bomb' || net.phase !== 'live' || player.dead || !b) return null;
  const attacker = net.myTeam === net.attack;
  if (attacker && b.s === 'carried' && b.c === net.id && inSite(player.position.x, player.position.z) && player.isGrounded) return 'plant';
  if (!attacker && b.s === 'planted' && Math.hypot(player.position.x - b.p[0], player.position.z - b.p[2]) < BOMB.defuseRange) return 'defuse';
  return null;
}
// ── MINIMAP ── north (+z) up, mirrored so it matches what you see: facing north, +x is on your left
const mini = { el: $('minimap'), bg: document.createElement('canvas'), map: null, s: 1, px: 190 };
function buildMinimap() {
  const { el, bg } = mini;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  el.width = el.height = bg.width = bg.height = Math.round(mini.px * dpr);
  const [bx, bz] = MAPS[currentMap].bound;
  mini.s = (mini.px - 12) / (2 * Math.max(bx, bz) + 2) * dpr;
  mini.map = currentMap;
  const g = bg.getContext('2d'), s = mini.s, c = bg.width / 2;
  const X = x => c - x * s, Z = z => c - z * s;
  g.clearRect(0, 0, bg.width, bg.height);
  g.fillStyle = 'rgba(150,175,140,0.55)';                       // walkable floor
  g.fillRect(X(bx + 0.5), Z(bz + 0.5), (2 * bx + 1) * s, (2 * bz + 1) * s);
  if (currentMap === 'bomb') {
    for (const st of BOMB_SITES) {
      g.fillStyle = 'rgba(230,120,60,0.45)';
      g.fillRect(X(st.x + st.hw), Z(st.z + st.hd), st.hw * 2 * s, st.hd * 2 * s);
      g.fillStyle = 'rgba(255,235,210,0.95)'; g.font = `bold ${Math.round(16 * dpr)}px sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(st.name, X(st.x), Z(st.z));
    }
  }
  for (const [x, , z, sx, sy, sz] of MAPS[currentMap].boxes) {
    g.fillStyle = sy >= 3 ? 'rgba(45,40,34,0.95)' : 'rgba(120,95,65,0.9)';   // walls dark, crates brown
    g.fillRect(X(x + sx / 2), Z(z + sz / 2), sx * s, sz * s);
  }
}
const TEAM_DOT = { blue: '#6fa2ff', red: '#ff7b70' };
function drawMinimap() {
  const show = net.mode === 'online' || net.mode === 'practice';
  mini.el.classList.toggle('show', show);
  if (!show) return;
  if (mini.map !== currentMap) buildMinimap();
  const g = mini.el.getContext('2d'), s = mini.s, c = mini.el.width / 2, k = mini.el.width / mini.px;
  const X = x => c - x * s, Z = z => c - z * s;
  g.clearRect(0, 0, mini.el.width, mini.el.height);
  g.drawImage(mini.bg, 0, 0);
  const dot = (x, z, color, r = 4) => {
    g.beginPath(); g.arc(X(x), Z(z), r * k, 0, Math.PI * 2);
    g.fillStyle = color; g.fill(); g.lineWidth = 1.5 * k; g.strokeStyle = '#111'; g.stroke();
  };
  const cross = (x, z, color) => {
    g.strokeStyle = color; g.lineWidth = 2 * k; g.beginPath();
    g.moveTo(X(x) - 3 * k, Z(z) - 3 * k); g.lineTo(X(x) + 3 * k, Z(z) + 3 * k);
    g.moveTo(X(x) + 3 * k, Z(z) - 3 * k); g.lineTo(X(x) - 3 * k, Z(z) + 3 * k); g.stroke();
  };
  const b = net.mode === 'online' && net.type === 'bomb' ? net.bomb : null;
  const attacker = net.myTeam === net.attack;
  const bombIcon = (x, z, color) => {
    g.fillStyle = color; g.strokeStyle = '#111'; g.lineWidth = 1.5 * k;
    g.fillRect(X(x) - 4 * k, Z(z) - 4 * k, 8 * k, 8 * k); g.strokeRect(X(x) - 4 * k, Z(z) - 4 * k, 8 * k, 8 * k);
  };
  // others: teammates always, enemies only while you can see them
  if (net.mode === 'online') {
    for (const [id, r] of net.remotes) {
      const a = r.avatar, mate = r.team === net.myTeam;
      if (r.dead || a.userData.dead) { if (mate) cross(a.position.x, a.position.z, TEAM_DOT[r.team]); continue; }
      if (!mate && !a.userData.tag.visible) continue;
      dot(a.position.x, a.position.z, TEAM_DOT[r.team]);
      if (b && b.s === 'carried' && b.c === id && mate) bombIcon(a.position.x, a.position.z - 0.1, '#ffb13b');
    }
  }
  if (b && (b.s === 'planted' || (b.s === 'dropped' && attacker))) {
    bombIcon(b.p[0], b.p[2], b.s === 'planted' && Math.sin(performance.now() / 150) > 0 ? '#ff3b2f' : '#ffb13b');
  }
  // me: an arrow pointing where I look
  const yaw = cam.yaw * Math.PI / 180, fx = -Math.sin(yaw), fz = -Math.cos(yaw);   // screen direction of "forward"
  const px = X(player.position.x), pz = Z(player.position.z), L = 8 * k;
  g.beginPath();
  g.moveTo(px + fx * L, pz + fz * L);
  g.lineTo(px - fx * L * 0.6 - fz * L * 0.55, pz - fz * L * 0.6 + fx * L * 0.55);
  g.lineTo(px - fx * L * 0.6 + fz * L * 0.55, pz - fz * L * 0.6 - fx * L * 0.55);
  g.closePath();
  g.fillStyle = player.dead ? '#888' : '#fff'; g.fill(); g.lineWidth = 1.5 * k; g.strokeStyle = '#111'; g.stroke();
  if (b && b.s === 'carried' && b.c === net.id) bombIcon(player.position.x, player.position.z - 2.2, '#ffb13b');
}

function updateBomb(dt) {
  // fireball
  if (boomT > 0) {
    boomT -= dt;
    const k = 1 - boomT / 1.4;
    boomBall.scale.setScalar(1 + 11 * Math.min(1, k * 2.5));
    boomBall.material.opacity = Math.max(0, 1 - k) * 0.9;
    if (boomT <= 0) boomBall.visible = false;
  }
  const fl = $('boom-flash');
  if (+fl.style.opacity > 0) fl.style.opacity = Math.max(0, +fl.style.opacity - dt * 1.2).toFixed(2);

  const hud = $('bomb-hud');
  if (net.mode !== 'online' || net.type !== 'bomb') { hud.classList.remove('show'); bombModel.visible = false; net.act = null; return; }
  hud.classList.add('show');
  const b = net.bomb;
  const attacker = net.myTeam === net.attack;
  $('bomb-role').className = 'role ' + (attacker ? 'attack' : 'defense');
  $('bomb-role').textContent = attacker ? (b && b.s === 'carried' && b.c === net.id ? '공격 · 💣 폭탄 소지' : '공격') : '수비';

  // hold E
  const can = bombAction();
  const act = can && keys['KeyE'] ? can : null;
  if (act !== net.act) { net.act = act; net.actT = 0; net.sendT = 0; }
  if (net.act) {
    net.actT += dt;
    if (Math.floor((net.actT - dt) * 4) !== Math.floor(net.actT * 4)) SFX.tone(net.act === 'plant' ? 900 : 600, 0.04, 0.08);
  }
  const need = net.act === 'plant' ? BOMB.plantTime : BOMB.defuseTime;
  $('bomb-bar').style.display = net.act ? 'block' : 'none';
  $('bomb-fill').style.width = net.act ? Math.min(100, net.actT / need * 100).toFixed(1) + '%' : '0';
  let hint = '';
  if (net.act) hint = net.act === 'plant' ? '설치 중…' : '해체 중…';
  else if (can) hint = can === 'plant' ? 'E 길게 눌러 폭탄 설치' : 'E 길게 눌러 폭탄 해체';
  else if (b && net.phase === 'live' && !player.dead) {
    if (b.s === 'planted') hint = attacker ? `${b.site} 사이트 폭탄을 지키세요` : `${b.site} 사이트로 가서 폭탄을 해체하세요!`;
    else if (b.s === 'dropped') hint = attacker ? '떨어진 폭탄을 주우세요' : '';
    else if (attacker && b.c === net.id) hint = 'A나 B 사이트로 가서 설치하세요';
  }
  $('bomb-hint').textContent = hint;

  // bomb model
  if (!b || b.s === 'exploded' || (b.s === 'carried' && b.c === net.id)) { bombModel.visible = false; return; }
  if (b.s === 'carried') {
    const r = net.remotes.get(b.c);
    if (!r || r.dead) { bombModel.visible = false; return; }
    const a = r.avatar;   // on their back
    bombModel.visible = true;
    bombModel.position.set(a.position.x - Math.sin(a.rotation.y) * 0.32, a.position.y + 1.05, a.position.z - Math.cos(a.rotation.y) * 0.32);
    bombModel.rotation.set(Math.PI / 2, a.rotation.y, 0);
  } else {
    bombModel.visible = true;
    bombModel.position.set(b.p[0], getGroundHeight(b.p[0], b.p[2]), b.p[2]);
    bombModel.rotation.set(0, 0.6, 0);
  }
  // planted: beeps speed up as the fuse runs out
  bombBlinkT = Math.max(0, bombBlinkT - dt);
  if (b.s === 'planted' && net.phase === 'live') {
    bombBeepT -= dt;
    if (bombBeepT <= 0) {
      bombBeepT = Math.max(0.12, Math.min(1, net.timer / BOMB.fuse * 1.1));
      bombBlinkT = 0.08;
      const dist = bombModel.position.distanceTo(player.position);
      SFX.tone(2300, 0.07, 0.16 * Math.max(0.25, 1 - dist / 45));
    }
  }
  bombLight.material.color.setHex(bombBlinkT > 0 || b.s === 'carried' && Math.sin(performance.now() / 300) > 0.7 ? 0xff2a2a : 0x551111);
}

function updateNet(dt) {
  // HUD
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('show'); }
  hurtT = Math.max(0, hurtT - dt);
  $('hurt').style.opacity = (hurtT * 1.6).toFixed(2);
  document.getElementById('hp').textContent = Math.max(0, Math.round(player.hp));
  for (let i = tracers.length - 1; i >= 0; i--) {
    const tr = tracers[i];
    tr.t -= dt;
    tr.line.material.opacity = Math.max(0, tr.t / 0.08) * 0.9;
    if (tr.t <= 0) { scene.remove(tr.line); tr.line.geometry.dispose(); tracers.splice(i, 1); }
  }
  if (net.mode !== 'online') return;

  $('score-blue').textContent = net.score.blue;
  $('score-red').textContent = net.score.red;
  const t = Math.max(0, Math.ceil(net.timer));
  $('round-timer').textContent = net.phase === 'prestart' ? t : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  const planted = net.type === 'bomb' && net.bomb && net.bomb.s === 'planted' && net.phase === 'live';
  $('round-timer').parentElement.classList.toggle('planted', planted);
  if (planted) $('round-timer').textContent = '💣 ' + $('round-timer').textContent;
  $('round-label').textContent = net.phase === 'prestart' ? `ROUND ${net.round} 준비` : `ROUND ${net.round}`;

  // send my state at 20 Hz
  net.sendT -= dt;
  if (net.sendT <= 0 && !player.dead) {
    net.sendT = 0.05;
    netSend({ t: 'state', p: player.position.toArray().map(v => +v.toFixed(3)), yaw: +cam.yaw.toFixed(1), pitch: +cam.pitch.toFixed(1),
      w: loadout.current, ads: ads.held, act: net.act });
  }

  // draw others 100 ms in the past, blending between the two snapshots around that time
  const renderTime = performance.now() / 1000 - INTERP_DELAY;
  const now = performance.now() / 1000;
  for (const r of net.remotes.values()) {
    const d = r.avatar, u = d.userData;
    const b = r.buf;
    if (b.length) {
      let i = b.length - 1;
      while (i > 0 && b[i - 1].time > renderTime) i--;
      const s1 = b[i], s0 = b[Math.max(0, i - 1)];
      const span = s1.time - s0.time;
      const k = span > 0 ? Math.min(1, Math.max(0, (renderTime - s0.time) / span)) : 1;
      const px = s0.p[0] + (s1.p[0] - s0.p[0]) * k, py = s0.p[1] + (s1.p[1] - s0.p[1]) * k, pz = s0.p[2] + (s1.p[2] - s0.p[2]) * k;
      const moved = Math.hypot(px - d.position.x, pz - d.position.z) / Math.max(dt, 1e-3);
      d.position.set(px, py, pz);
      let dy = s1.yaw - s0.yaw;
      dy = ((dy + 540) % 360) - 180;
      d.rotation.y = (s0.yaw + dy * k) * Math.PI / 180;
      u.moving = moved > 1;
      u.pitch = s0.pitch + (s1.pitch - s0.pitch) * k;
      u.weapon = s1.w;
    }
    // name tag only when that player's head is actually in view (tags draw on top, so walls must hide them here)
    _tagFrom.copy(camera.position);
    _tagTo.set(d.position.x, d.position.y + 1.7, d.position.z);
    const tagDist = _tagFrom.distanceTo(_tagTo);
    tagRay.set(_tagFrom, _tagTo.sub(_tagFrom).normalize());
    tagRay.far = tagDist;
    u.tag.visible = !(r.dead || u.dead) && tagRay.intersectObjects(worldMeshes()).length === 0;
    if (r.dead || u.dead) {
      u.deadT = (u.deadT || 0) + dt;
      d.rotation.x = -(Math.min(1, u.deadT / 0.35) ** 2) * Math.PI / 2;
      u.flash.visible = false;
      continue;
    }
    d.rotation.x = 0;
    animateDummy(d, now, u.moving);
    // arms forward holding the gun, tilted with the player's view pitch
    const aim = -Math.PI / 2 - (u.pitch || 0) * Math.PI / 180;
    u.swingT = Math.max(0, (u.swingT || 0) - dt);
    u.armR.rotation.x = aim + (u.swingT > 0 ? Math.sin(u.swingT * 18) * 0.8 : 0);
    u.armL.rotation.x = aim + 0.15;
    u.armL.rotation.z = -0.5;
    u.gun.visible = u.weapon !== 'knife';
    u.flashT = Math.max(0, u.flashT - dt);
    u.flash.visible = u.flashT > 0;
    u.hitT = Math.max(0, (u.hitT || 0) - dt);
    const squash = u.hitT > 0 ? 1 + u.hitT * 1.5 : 1;
    d.scale.set(squash, 2 - squash, 1);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  updateNet(dt);
  updateBomb(dt);
  drawMinimap();
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(vmScene, vmCamera);
}

// ── RESIZE ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  vmCamera.aspect = camera.aspect;
  vmCamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
