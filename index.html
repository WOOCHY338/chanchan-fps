<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChanChan TPS</title>
<script src="lib/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #222; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }

#crosshair {
  position: fixed; top: 50%; left: 50%; width: 0; height: 0;
  pointer-events: none; z-index: 10; --gap: 4px;
}
#crosshair i {
  position: absolute; background: rgba(255,255,255,0.9);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
}
#crosshair .t { width: 2px; height: 8px; left: -1px; bottom: var(--gap); }
#crosshair .b { width: 2px; height: 8px; left: -1px; top: var(--gap); }
#crosshair .l { width: 8px; height: 2px; top: -1px; right: var(--gap); }
#crosshair .r { width: 8px; height: 2px; top: -1px; left: var(--gap); }

#hud {
  position: fixed; bottom: 20px; left: 20px; color: #fff; font-size: 13px;
  background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 8px;
  pointer-events: none; z-index: 10; line-height: 1.6;
}

#settings-panel {
  position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7);
  padding: 16px 20px; border-radius: 10px; color: #fff; font-size: 13px;
  z-index: 20; display: none; min-width: 240px;
}
#settings-panel.visible { display: block; }
#settings-panel label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
#settings-panel input[type=range] { width: 120px; }
#settings-panel .val { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

#start-screen {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; z-index: 100; cursor: pointer; pointer-events: none;
}
#start-screen h1 { font-size: 36px; margin-bottom: 12px; }
#start-screen p { font-size: 16px; opacity: 0.7; }
#start-screen.hidden { display: none; }

#hitmarker {
  position: fixed; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
  pointer-events: none; z-index: 11; opacity: 0; transition: opacity 0.12s;
}
#hitmarker::before, #hitmarker::after {
  content: ''; position: absolute; left: 10px; top: -2px; width: 2px; height: 26px;
  background: linear-gradient(#fff 0 35%, transparent 35% 65%, #fff 65%);
}
#hitmarker::before { transform: rotate(45deg); }
#hitmarker::after { transform: rotate(-45deg); }
#hitmarker.head::before, #hitmarker.head::after { background: linear-gradient(#ff4a3d 0 35%, transparent 35% 65%, #ff4a3d 65%); }
#hitmarker.show { opacity: 1; transition: none; }

#ammo {
  position: fixed; bottom: 20px; right: 24px; color: #fff; z-index: 10; pointer-events: none;
  font-weight: 700; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); text-align: right;
}
#ammo .cur { font-size: 40px; }
#ammo .max { font-size: 18px; opacity: 0.7; }
#ammo .reload { font-size: 14px; color: #ffcc00; height: 18px; }
#ammo .wname { font-size: 16px; opacity: 0.9; }
#ammo .slots { font-size: 11px; font-weight: 500; opacity: 0.55; margin-top: 2px; }

#killfeed {
  position: fixed; top: 58%; left: 50%; transform: translateX(-50%); color: #fff; z-index: 10;
  font-weight: 800; font-size: 18px; letter-spacing: 1px; pointer-events: none;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.4s;
}
#killfeed.show { opacity: 1; transition: none; }

/* ── menu / lobby / match HUD ── */
.overlay {
  position: fixed; inset: 0; background: rgba(12,14,18,0.88); z-index: 120;
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: 14px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: 40px; letter-spacing: 1px; }
.overlay h2 { font-size: 22px; }
.overlay .sub { opacity: 0.65; font-size: 14px; }
.overlay .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.btn {
  background: #f2efe6; color: #1a1410; border: 2px solid #1a1410; border-radius: 6px; padding: 10px 18px;
  font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 #1a1410; font-family: inherit;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1a1410; }
.btn.blue { background: #6f9be6; } .btn.red { background: #e07a72; } .btn.ghost { background: #3a3d44; color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.field {
  background: #22252b; color: #fff; border: 2px solid #555; border-radius: 6px; padding: 9px 12px; font-size: 15px;
  font-family: inherit; width: 150px;
}
#menu-error { color: #ff8a80; min-height: 18px; font-size: 14px; }
#lobby-code { font-size: 46px; font-weight: 800; letter-spacing: 8px; font-family: monospace; }
.teams { display: flex; gap: 18px; }
.team-box { width: 200px; min-height: 120px; border-radius: 8px; padding: 12px; border: 2px solid #1a1410; }
.team-box.blue { background: rgba(74,127,217,0.35); } .team-box.red { background: rgba(217,83,74,0.35); }
.team-box h3 { margin-bottom: 8px; font-size: 16px; }
.team-box div { padding: 3px 0; font-size: 15px; }

#scorebar {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 12; pointer-events: none;
  display: none; align-items: center; gap: 12px; color: #fff; font-weight: 800; text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
}
#scorebar.show { display: flex; }
#scorebar .s { font-size: 30px; min-width: 36px; text-align: center; padding: 2px 10px; border-radius: 6px; }
#scorebar .s.blue { background: rgba(74,127,217,0.85); } #scorebar .s.red { background: rgba(217,83,74,0.85); }
#scorebar .mid { text-align: center; font-size: 14px; line-height: 1.3; min-width: 90px; }
#scorebar .mid b { font-size: 22px; display: block; }
#banner {
  position: fixed; top: 30%; left: 50%; transform: translateX(-50%); z-index: 13; pointer-events: none; color: #fff;
  font-size: 44px; font-weight: 900; text-shadow: 3px 3px 0 rgba(0,0,0,0.6); text-align: center; opacity: 0; transition: opacity 0.3s;
}
#banner.show { opacity: 1; }
#banner small { display: block; font-size: 18px; font-weight: 700; opacity: 0.85; margin-top: 6px; }
#feed { position: fixed; top: 60px; right: 18px; z-index: 12; pointer-events: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
#feed div { background: rgba(0,0,0,0.55); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 700; }
#feed .blue { color: #8fb6ff; } #feed .red { color: #ff9a92; }
#hurt { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(200,20,20,0.75) 100%); }
#dead-msg { position: fixed; top: 42%; left: 50%; transform: translateX(-50%); z-index: 13; pointer-events: none;
  color: #fff; font-size: 26px; font-weight: 800; text-shadow: 2px 2px 0 rgba(0,0,0,0.6); display: none; text-align: center; }

#bomb-hud { position: fixed; top: 92px; left: 50%; transform: translateX(-50%); z-index: 12; pointer-events: none; display: none;
  color: #fff; font-weight: 800; text-align: center; text-shadow: 2px 2px 0 rgba(0,0,0,0.55); font-size: 15px; }
#bomb-hud.show { display: block; }
#bomb-hud .role.attack { color: #ffb37a; } #bomb-hud .role.defense { color: #9fd0ff; }
#bomb-hint { margin-top: 4px; font-size: 14px; color: #ffe9a8; min-height: 18px; }
#bomb-bar { width: 220px; height: 10px; margin: 6px auto 0; border: 2px solid #1a1410; border-radius: 5px; background: rgba(0,0,0,0.45); display: none; overflow: hidden; }
#bomb-bar i { display: block; height: 100%; width: 0; background: #ffcc33; }
#scorebar .mid.planted b { color: #ff5a4a; }
#boom-flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: #fff3d6; }

#minimap { position: fixed; top: 14px; left: 14px; width: 190px; height: 190px; z-index: 11; pointer-events: none; display: none;
  border: 2px solid #1a1410; border-radius: 6px; background: rgba(20,24,20,0.55); }
#minimap.show { display: block; }

#debug-info {
  position: fixed; top: 214px; left: 20px; color: rgba(255,255,255,0.5);
  font-size: 11px; font-family: monospace; z-index: 10; pointer-events: none;
}
</style>
</head>
<body>

<div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
<div id="hitmarker"></div>
<div id="killfeed"></div>
<div id="ammo"><div class="reload" id="reload-text"></div><div class="wname" id="weapon-name">AK</div><div id="ammo-count"><span class="cur" id="ammo-cur">30</span><span class="max"> / 30</span></div><div class="slots" id="slot-hint">1 AK · 3 기본칼</div></div>

<div id="hud">
  <div>HP: <span id="hp">100</span> / 100</div>
  <div>Speed: <span id="speed">0.0</span></div>
  <div id="sprint-indicator" style="color:#ffcc00;display:none">SPRINT</div>
</div>

<div id="settings-panel">
  <div style="font-weight:600;margin-bottom:8px">Settings (ESC)</div>
  <label>Sensitivity <input type="range" id="sens-slider" min="0.01" max="10" step="0.01" value="0.4"> <input type="number" id="sens-input" min="0.01" max="10" step="0.01" value="0.4" style="width:52px;background:#222;color:#fff;border:1px solid #555;border-radius:3px;padding:1px 4px;font-size:12px;text-align:right"></label>
  <label>Camera Dist <input type="range" id="dist-slider" min="1" max="8" step="0.1" value="3.5"> <span class="val" id="dist-val">3.5</span></label>
  <label>FOV <input type="range" id="fov-slider" min="50" max="110" step="1" value="65"> <span class="val" id="fov-val">65</span></label>
  <label>Invert Y <input type="checkbox" id="invert-y"></label>
  <label>Volume <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.7"> <span class="val" id="vol-val">70</span></label>
  <label>칼 <select id="knife-select" style="background:#222;color:#fff;border:1px solid #555;border-radius:3px;padding:2px 4px;font-size:12px">
    <option value="basic">기본칼</option>
    <option value="karambit">카람빗</option>
  </select></label>
  <button class="btn ghost" id="btn-to-menu" style="margin-top:10px;width:100%;padding:7px">메뉴로 나가기</button>
</div>

<div id="start-screen" class="hidden">
  <h1>ChanChan</h1>
  <p>클릭해서 계속</p>
</div>

<div id="menu" class="overlay">
  <h1>ChanChan FPS</h1>
  <div class="row"><input id="name-input" class="field" maxlength="12" placeholder="닉네임"></div>
  <div class="row">
    <button class="btn" id="btn-practice">연습장</button>
  </div>
  <div class="row">
    <span class="sub" style="width:64px">섬멸전</span>
    <button class="btn blue" id="btn-create-1v1">방 만들기 · 1대1</button>
    <button class="btn blue" id="btn-create-2v2">방 만들기 · 2대2</button>
  </div>
  <div class="row">
    <span class="sub" style="width:64px">폭탄전</span>
    <button class="btn red" id="btn-bomb-1v1">방 만들기 · 1대1</button>
    <button class="btn red" id="btn-bomb-2v2">방 만들기 · 2대2</button>
  </div>
  <div class="row">
    <input id="code-input" class="field" maxlength="4" placeholder="방 코드" style="text-transform:uppercase;width:120px">
    <button class="btn ghost" id="btn-join">참가</button>
  </div>
  <div id="menu-error"></div>
  <div class="sub">5점 먼저 내는 팀 승리 · 폭탄전은 매 라운드 공격/수비가 바뀌어요 · E 길게: 설치/해체</div>
</div>

<div id="lobby" class="overlay hidden">
  <div class="sub" id="lobby-mode">1대1</div>
  <div id="lobby-code">----</div>
  <div class="sub">친구에게 이 코드를 알려주세요</div>
  <div class="teams">
    <div class="team-box blue"><h3>블루</h3><div id="lobby-blue"></div></div>
    <div class="team-box red"><h3>레드</h3><div id="lobby-red"></div></div>
  </div>
  <div class="row">
    <button class="btn ghost" id="btn-swap">팀 바꾸기</button>
    <button class="btn" id="btn-start">시작</button>
    <button class="btn ghost" id="btn-leave">나가기</button>
  </div>
  <div id="lobby-msg" class="sub"></div>
</div>

<div id="scorebar"><span class="s blue" id="score-blue">0</span><div class="mid"><b id="round-timer">1:40</b><span id="round-label">ROUND 1</span></div><span class="s red" id="score-red">0</span></div>
<div id="bomb-hud"><span class="role" id="bomb-role"></span><div id="bomb-hint"></div><div id="bomb-bar"><i id="bomb-fill"></i></div></div>
<div id="boom-flash"></div>
<div id="banner"></div>
<div id="feed"></div>
<div id="hurt"></div>
<div id="dead-msg">사망<br><small style="font-size:16px">다음 라운드까지 관전 중</small></div>

<canvas id="minimap"></canvas>
<div id="debug-info"></div>

<script>
// ── CONFIG ──
const CONFIG = {
  sensitivity: 0.4,
  cameraDistance: 3.5,
  fov: 65,
  invertY: false,
  walkSpeed: 7,
  sprintSpeed: 7,
  jumpForce: 7,
  dodgeSpeed: 17,
  dodgeDuration: 0.3,
  dodgeCooldown: 0.45, // counted from the end of the dodge
  gravity: -28,
  groundFriction: 0.92,
  airFriction: 0.998,
  airAccel: 2.5,
  groundAccel: 11,
  shoulderOffset: new THREE.Vector3(0.4, 1.5, 0),
  cameraMinPitch: -89,
  cameraMaxPitch: 89,
  cameraCollisionRadius: 0.25,
};

// ── AUDIO ── (files in sounds/, credits in sounds/CREDITS.txt)
const SFX = (() => {
  let ac = null, master = null;
  const buffers = {};
  let volume = 0.7;
  const FILES = {
    ak: 'ak47_near.wav', reload: 'ak_reload.wav', rack: 'ak_rack.wav', click: 'metalClick.ogg',
    slice1: 'knifeSlice.ogg', slice2: 'knifeSlice2.ogg',
    draw1: 'drawKnife1.ogg', draw2: 'drawKnife2.ogg', draw3: 'drawKnife3.ogg',
    cloth1: 'cloth1.ogg', cloth2: 'cloth2.ogg',
    ...Object.fromEntries([...Array(10)].map((_, i) => ['step' + i, `footstep0${i}.ogg`])),
  };
  // single AK-47 shots (near, in front of the shooter) cut out of the Free Firearm Sound Library take
  const SHOT_ONSETS = [0.61, 3.255, 6.02, 9.155];

  function sliceShot(src, onset) {
    const sr = src.sampleRate, len = Math.floor(sr * 0.9), fade = Math.floor(sr * 0.4);
    const start = Math.max(0, Math.floor((onset - 0.01) * sr));
    const out = ac.createBuffer(src.numberOfChannels, len, sr);
    let peak = 0;
    for (let c = 0; c < src.numberOfChannels; c++) {
      const s = src.getChannelData(c), d = out.getChannelData(c);
      for (let i = 0; i < len; i++) { d[i] = s[start + i] || 0; peak = Math.max(peak, Math.abs(d[i])); }
    }
    for (let c = 0; c < out.numberOfChannels; c++) {
      const d = out.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const tail = i > len - fade ? (len - i) / fade : 1;
        d[i] = d[i] / peak * 0.95 * tail;
      }
    }
    return out;
  }

  async function load() {
    await Promise.all(Object.entries(FILES).map(async ([k, f]) => {
      try {
        const data = await fetch('sounds/' + f).then(r => r.arrayBuffer());
        buffers[k] = await ac.decodeAudioData(data);
      } catch (e) { console.warn('sound failed to load', f, e); }
    }));
    if (buffers.ak) buffers.shots = SHOT_ONSETS.map(t => sliceShot(buffers.ak, t));
  }

  // created on the first click (browsers block audio until the user interacts)
  function unlock() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = volume;
      master.connect(ac.destination);
      load();
    }
    if (ac.state === 'suspended') ac.resume();
  }

  // play a buffer (or one of an array at random); returns the source so scheduled sounds can be stopped
  function play(name, { vol = 1, rate = 1, jitter = 0, delay = 0, offset = 0 } = {}) {
    if (!ac) return null;
    let buf = buffers[name];
    if (Array.isArray(buf)) buf = buf[Math.floor(Math.random() * buf.length)];
    if (!buf) return null;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate * (1 + (Math.random() - 0.5) * 2 * jitter);
    const g = ac.createGain();
    g.gain.value = vol;
    src.connect(g).connect(master);
    src.start(ac.currentTime + Math.max(0, delay), offset);
    return src;
  }

  // short generated tones for UI feedback (hit marker, headshot, kill)
  function tone(freq, dur, vol, delay = 0, type = 'square') {
    if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  // generated explosion: low-passed noise burst with a long tail
  function boom(vol = 1) {
    if (!ac) return;
    const len = Math.floor(ac.sampleRate * 2.2);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf;
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2200, ac.currentTime);
    lp.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 1.6);
    g.gain.value = vol;
    src.connect(lp).connect(g).connect(master);
    src.start();
    tone(55, 1.2, 0.5 * vol, 0, 'sine');
  }

  function setVolume(v) {
    volume = v;
    if (master) master.gain.value = v;
  }

  return { unlock, play, tone, boom, setVolume, get volume() { return volume; } };
})();

const sfx = {
  shot: () => SFX.play('shots', { vol: 0.5, jitter: 0.03 }),
  dryFire: () => SFX.play('click', { vol: 0.6, rate: 1.4 }),
  hit: head => head ? (SFX.tone(1900, 0.06, 0.12), SFX.tone(2600, 0.08, 0.1, 0.035)) : SFX.tone(1500, 0.05, 0.1),
  kill: () => { SFX.tone(880, 0.09, 0.12, 0, 'triangle'); SFX.tone(1320, 0.16, 0.12, 0.08, 'triangle'); },
  step: (vol = 0.3) => SFX.play('step' + Math.floor(Math.random() * 10), { vol, jitter: 0.06 }),
  jump: () => SFX.play('cloth1', { vol: 0.35, jitter: 0.05 }),
  land: () => { sfx.step(0.45); sfx.step(0.3); },
  dodge: () => { SFX.play('cloth2', { vol: 0.45, rate: 1.2 }); sfx.step(0.35); },
  rifleRaise: () => SFX.play('click', { vol: 0.35, rate: 0.9 }),
};
// reload sounds are scheduled on the reload timeline; canceling stops them
let reloadSounds = [];
let stepDistance = 0;
function playReloadSounds(empty) {
  stopReloadSounds();
  // reload clip's mag-seat click is at 1.27s; our mag seats at 1.4s
  reloadSounds.push(SFX.play('reload', { vol: 0.8, delay: 0.13 }));
  // rack clip's bolt slam is at 1.29s; our handle is released at 1.86s (play only the slam part)
  if (empty) reloadSounds.push(SFX.play('rack', { vol: 0.75, delay: 1.57, offset: 1.0 }));
  reloadSounds = reloadSounds.filter(Boolean);
}
function stopReloadSounds() {
  for (const s of reloadSounds) { try { s.stop(); } catch (e) { /* already ended */ } }
  reloadSounds = [];
}
// knife swing/draw sounds, timed so each swoosh peaks on the swing's hit frame
function playKnifeSound(name) {
  // swoosh peaks: slice1 at 0.23s, slice2 at 0.01s — line them up with this knife's hit frame
  const hitAt = knifeAnim(name).hitAt || 0;
  if (name === 'lightA') SFX.play('slice1', { vol: 0.7, delay: hitAt - 0.23, offset: Math.max(0, 0.23 - hitAt), jitter: 0.05 });
  if (name === 'lightB') SFX.play('slice2', { vol: 0.7, delay: hitAt - 0.01, jitter: 0.05 });
  if (name === 'heavy') SFX.play('slice1', { vol: 0.85, rate: 0.85, delay: hitAt - 0.27, offset: Math.max(0, 0.27 - hitAt) });
  if (name === 'draw') {
    SFX.play(['draw1', 'draw2', 'draw3'][Math.floor(Math.random() * 3)], { vol: 4, delay: 0.02 });
    SFX.play('click', { vol: 0.35, rate: 1.3, delay: 0.32 });   // catch
  }
  if (name === 'inspect') SFX.play('cloth1', { vol: 0.25, delay: 0.1 });
}

// ── THREE.JS SETUP ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.autoClear = false;
renderer.setSize(window.innerWidth, window.innerHeight);

const paperTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1400; i++) {
    const v = 215 + Math.random() * 40;
    g.fillStyle = `rgb(${v},${v},${v - 6})`;
    g.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 2, 1);
  }
  g.strokeStyle = 'rgba(120,110,90,0.12)';
  for (let i = 0; i < 18; i++) {
    g.beginPath();
    const x = Math.random() * 128, y = Math.random() * 128;
    g.moveTo(x, y);
    g.lineTo(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 10);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

const inkMat = new THREE.LineBasicMaterial({ color: 0x1a1410 });
const vmMats = {};
function vmMat(color) {
  if (!vmMats[color]) vmMats[color] = new THREE.MeshLambertMaterial({ color, map: paperTex, flatShading: true });
  return vmMats[color];
}
function inked(geo, color) {
  const mesh = new THREE.Mesh(geo, vmMat(color));
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), inkMat));
  return mesh;
}
function part(parent, w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = inked(new THREE.BoxGeometry(w, h, d), color);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  parent.add(m);
  return m;
}
function tube(parent, r, len, color, x, y, z) {
  const m = inked(new THREE.CylinderGeometry(r, r, len, 8), color);
  m.rotation.x = Math.PI / 2;
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function limb(parent, from, to, w, h, color) {
  const len = from.distanceTo(to);
  const m = inked(new THREE.BoxGeometry(w, h, len), color);
  m.position.copy(from).add(to).multiplyScalar(0.5);
  m.lookAt(to);
  parent.add(m);
  return m;
}

function poseLeftForearm(lh, el) {
  _fa.set(L_WRIST.x + lh[0], L_WRIST.y + lh[1], L_WRIST.z + lh[2]);

  tac:   { keys: RELOAD_TAC_KEYS,   time: 2.0, fillP: 0.70,  readyP: 0.86 },
  // fillP = mag seated (gun counts as loaded). Firing stays locked until readyP (after the rack) unless the reload is canceled.
  empty: { keys: RELOAD_EMPTY_KEYS, time: 2.6, fillP: 0.538, readyP: 0.84 },
};
function sampleReload(keys, p) {
  let i = 0;
  while (i < keys.length - 2 && p > keys[i + 1].p) i++;
  const a = keys[i], b = keys[i + 1];
  let t = Math.min(1, Math.max(0, (p - a.p) / (b.p - a.p)));
  t = t * t * (3 - 2 * t);
  const mix = k => (a[k] || [0, 0, 0]).map((v, j) => v + ((b[k] || [0, 0, 0])[j] - v) * t);
  // without an explicit elbow, the arm moves rigidly with the hand
  const elbow = k => k.el || [L_ELBOW_REST.x + k.lh[0], L_ELBOW_REST.y + k.lh[1], L_ELBOW_REST.z + k.lh[2]];
  const ea = elbow(a), eb = elbow(b);
  const el = ea.map((v, j) => v + (eb[j] - v) * t);
  return { gr: mix('gr'), gp: mix('gp'), mag: mix('mag'), lh: mix('lh'), ch: mix('ch')[0], el };
}

const obstacles = [];
function addObstacle(x, y, z, sx, sy, sz, color) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  const mat = paperMaterial(color);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  obstacles.push({
    mesh,
    min: new THREE.Vector3(x - sx/2, y - sy/2, z - sz/2),
    max: new THREE.Vector3(x + sx/2, y + sy/2, z + sz/2),
  });
}

const WEAPON = { magSize: 30, fireInterval: 0.1, bodyDmg: 17, headDmg: 34, range: 200 };   // 6 body shots (0.5 s at 600 rpm), or 3 heads
const weapon = { ammo: WEAPON.magSize, cooldown: 0, reloading: 0, reload: RELOADS.tac, kick: 0, spray: 0 };

// Recoil is tracked as an offset on top of the player's aim so it can be recovered after a burst.
// recoverMaxSpeed (deg/s) caps the pull-back so big climbs come down at a steady pace; recoverRate only shapes the final ease-out
// sprayResetDelay/Rate: after a short pause the pattern rewinds ~15 shots/s (a 3-shot burst is fully reset in ~0.3s)
const RECOIL = {
  recoverDelay: 0.12, recoverRate: 9, recoverMaxSpeed: 7, kickSmooth: 22,
  sprayResetDelay: 0.12, sprayResetRate: 15,
  plateauShot: 11, lateJitter: 0.28,
};

// CS AK / Valorant Vandal-style pattern, cumulative [pitch up, yaw left] in degrees per shot:
// shots 1-3 barely move (tap accuracy), 4-11 climb hard, then the climb plateaus and
// the spray becomes a slow left-then-right sweep (random wobble is added per shot in fireShot)
const SPRAY = (() => {
  const climb = [0, 0.15, 0.3, 0.7, 1.0, 1.1, 1.05, 0.95, 0.8, 0.65, 0.45, 0.3];
  const out = [];
  let p = 0;
  for (let i = 0; i < 31; i++) {
    p += i < climb.length ? climb[i] : 0.06;
    const y = i < RECOIL.plateauShot
      ? -0.03 * i
      : -0.3 + 1.1 * Math.sin(((i - RECOIL.plateauShot) / 18) * Math.PI * 2);
    out.push([p, y]);
  }
  return out;
})();

// radius of the random cone (deg) for the shot at spray index i
function currentSpread(i) {
  const speedNow = Math.hypot(player.velocity.x, player.velocity.z);
  const hip = Math.min(0.9, 0.1 + 0.03 * i)
    + Math.pow(Math.min(1.5, speedNow / CONFIG.walkSpeed), 1.5) * 1.8
    + (player.isGrounded ? 0 : 3.5);
  return hip * (1 + (ADS.spreadMul - 1) * adsEase());
}

const recoil = { pitch: 0, yaw: 0, pendPitch: 0, pendYaw: 0, sinceShot: 1 };
function applyPendingKick(dt) {
  const f = Math.min(1, RECOIL.kickSmooth * dt);
  const dp = Math.min(CONFIG.cameraMaxPitch - cam.pitch, recoil.pendPitch * f);
  const dy = recoil.pendYaw * f;
  cam.pitch += dp;
  cam.yaw += dy;
  recoil.pitch += dp;
  recoil.yaw += dy;
  recoil.pendPitch -= recoil.pendPitch * f;
  recoil.pendYaw -= dy;
}
// mouse movement against the recoil uses it up, so recovery never drags the aim past where the player pulled to
function compensateRecoil(dPitch, dYaw) {
  if (recoil.pitch > 0 && dPitch < 0) recoil.pitch = Math.max(0, recoil.pitch + dPitch);
  if (recoil.yaw * dYaw < 0) {
    const y = recoil.yaw + dYaw;
    recoil.yaw = Math.sign(y) === Math.sign(recoil.yaw) ? y : 0;
  }
}
function recoverRecoil(dt) {
  recoil.sinceShot += dt;
  if (recoil.sinceShot < RECOIL.recoverDelay) return;
  const mag = Math.hypot(recoil.pitch, recoil.yaw);
  if (mag < 1e-4) return;
  const step = Math.min(mag, mag * RECOIL.recoverRate * dt, RECOIL.recoverMaxSpeed * dt);
  const dp = recoil.pitch / mag * step, dy = recoil.yaw / mag * step;
  cam.pitch -= dp;
  cam.yaw -= dy;
  recoil.pitch -= dp;
  recoil.yaw -= dy;
}
const reloadProgress = () => weapon.reloading > 0 ? 1 - weapon.reloading / weapon.reload.time : 0;

// Reload cancel: stops the reload where it is. Ammo already seated stays; the viewmodel eases back to the hip.
const RELOAD_CANCEL_BLEND = 0.15;
const reloadCancel = { t: 0, keys: null, p: 0 };
function cancelReload() {
  if (weapon.reloading <= 0) return;
  reloadCancel.keys = weapon.reload.keys;
  reloadCancel.p = reloadProgress();
  reloadCancel.t = RELOAD_CANCEL_BLEND;
  weapon.reloading = 0;
  stopReloadSounds();
}
// pose of the reload animation this frame, including the ease-out after a cancel
function currentReloadPose(dt) {
  if (weapon.reloading > 0) return sampleReload(weapon.reload.keys, reloadProgress());
  if (reloadCancel.t > 0) {
    reloadCancel.t = Math.max(0, reloadCancel.t - dt);
    const from = sampleReload(reloadCancel.keys, reloadCancel.p);
    let k = reloadCancel.t / RELOAD_CANCEL_BLEND;
    k = k * k * (3 - 2 * k);
    const scale = arr => arr.map(v => v * k);   // the hip pose is all zeros
    return { gr: scale(from.gr), gp: scale(from.gp), mag: scale(from.mag), lh: scale(from.lh), ch: from.ch * k,
      el: from.el.map((v, j) => L_ELBOW_REST.getComponent(j) + (v - L_ELBOW_REST.getComponent(j)) * k) };
  }
  return sampleReload(weapon.reload.keys, 0);
}

function fireShot() {
  weapon.ammo--;
  sfx.shot();
  weapon.kick = 1;
  flashTimer = 0.04;
  muzzleFlash.rotation.z = Math.random() * Math.PI;

  const i = Math.min(SPRAY.length - 1, Math.floor(weapon.spray));
  const prev = i > 0 ? SPRAY[i - 1] : [0, 0];
  weapon.spray += 1;

  // kick is queued and eased into the view over a few frames (see applyPendingKick)
  // past the plateau, a little random sideways wobble on top of the fixed sweep (Valorant-style)
  const jitter = i >= RECOIL.plateauShot ? RECOIL.lateJitter : 0.03;
  const kickMul = 1 + (ADS.recoilMul - 1) * adsEase();
  recoil.pendPitch += (SPRAY[i][0] - prev[0] + Math.random() * 0.03) * kickMul;
  recoil.pendYaw += (SPRAY[i][1] - prev[1] + (Math.random() - 0.5) * jitter) * kickMul;
  recoil.sinceShot = 0;

  // bullet goes where the crosshair is heading (current view + queued kick) plus random spread
  const spreadDeg = currentSpread(i);
  const r = spreadDeg * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2;
  const offPitch = recoil.pendPitch + Math.sin(a) * r;
  const offYaw = recoil.pendYaw + Math.cos(a) * r;

  camera.updateMatrixWorld();
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const rightV = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const dir = fwd
    .addScaledVector(up, Math.tan(offPitch * Math.PI / 180))
    .addScaledVector(rightV, -Math.tan(offYaw * Math.PI / 180))  // +yaw turns left
    .normalize();
  shootRay.set(camera.position, dir);
  shootRay.far = WEAPON.range;

  const targets = [...worldMeshes(), ...dummies.filter(d => !d.userData.dead)];
  const hit = shootRay.intersectObjects(targets, true).find(h => h.object.isMesh);
  reportShot(camera.position, hit ? hit.point : camera.position.clone().addScaledVector(dir, 80));

  if (!hit) return;
  const normal = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : dir.clone().negate();
  const dummy = hit.object.userData.dummy;
  if (dummy) {
    const head = !!hit.object.userData.isHead;
    const u = dummy.userData;
    if (reportHit(dummy, head ? WEAPON.headDmg : WEAPON.bodyDmg, head, 'rifle')) {
      if (u.team !== net.myTeam) { u.hitT = 0.12; spawnConfetti(hit.point, normal, head ? 0xf4efe2 : hit.object.material.color.getHex(), head ? 14 : 7); }
      return;
    }
    u.hp -= head ? WEAPON.headDmg : WEAPON.bodyDmg;
    u.hitT = 0.12;
    showHitmarker(head);
    spawnConfetti(hit.point, normal, head ? 0xf4efe2 : hit.object.material.color.getHex(), head ? 14 : 7);
    if (u.hp <= 0) {
      u.dead = true;
      u.deadT = 0;
      showKill(head ? 'HEADSHOT' : 'ELIMINATED');
    }
  } else {
    addDecal(hit.point, normal);
    spawnConfetti(hit.point, normal, hit.object.material.color.getHex(), 4);
  }
}

KR_IDLE.p = refPos(...KR_IDLE.at);
const KNIFE_SKIN_ANIMS = { karambit: KARAMBIT_ANIMS };
const KNIFE_SKIN_IDLE = { karambit: KR_IDLE };
const knifeIdle = () => KNIFE_SKIN_IDLE[knifeSkin] || K_IDLE;

const knifeAnim = name => (KNIFE_SKIN_ANIMS[knifeSkin] && KNIFE_SKIN_ANIMS[knifeSkin][name]) || KNIFE_ANIMS[name];

// long slash streak (light attacks): a thin white strip from where the swing starts to where it ends
const streakMat = new THREE.MeshBasicMaterial({ color: 0xf4f8ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
const knifeStreak = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), streakMat);
knifeRoot.add(knifeStreak);
let streakT = 0;
function showStreak(s) {
  knifeStreak.position.set((s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2, (s.a[2] + s.b[2]) / 2);
  knifeStreak.rotation.set(0, 0, Math.atan2(s.b[1] - s.a[1], s.b[0] - s.a[0]));

// from = the pose the hand was in when this animation started, so attacks blend in instead of snapping
const knifeState = { anim: null, t: 0, combo: 0, hitDone: false, from: null, last: null };

function sampleKnife(anim, t) {
  const keys = anim.keys;
  let i = 0;
  while (i < keys.length - 2 && t > keys[i + 1].t) i++;
  const a = i === 0 && knifeState.from ? { t: keys[0].t, ...knifeState.from } : keys[i], b = keys[i + 1];
  let u = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)));
  if (anim.ease !== 'linear') u = u * u * (3 - 2 * u);
  const mix = (k, def) => (a[k] || def).map((v, j) => v + ((b[k] || def)[j] - v) * u);
  const pose = { p: mix('p'), r: mix('r'), lp: mix('lp', LH_REST), open: !!a.open, pivotRing: !!anim.pivotRing };
  if (a.kp && b.kp) {           // knife in the air: its own position and blade angle
    pose.kp = mix('kp');
    pose.ka = a.ka + (b.ka - a.ka) * u;
    pose.kt = (a.kt || 0) + ((b.kt || 0) - (a.kt || 0)) * u;
  }
  return pose;
}

function startKnifeAnim(name, fromCurrent = true) {
  knifeState.anim = knifeAnim(name);
  playKnifeSound(name);
  if (net.mode === 'online' && name !== 'inspect') netSend({ t: 'anim', name });
  knifeState.t = 0;
  knifeState.hitDone = false;
  knifeState.from = fromCurrent && knifeState.last ? knifeState.last : null;
}

const knifeRay = new THREE.Raycaster();
function knifeStrike(anim) {
  camera.updateMatrixWorld();
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const rightV = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const targets = [...worldMeshes(), ...dummies.filter(d => !d.userData.dead)];
  let best = null;
  // a small fan of rays so the swing is forgiving like real melee
  for (const [dx, dy] of [[0, 0], [-0.07, 0], [0.07, 0], [0, -0.06], [0, 0.06]]) {
    const dir = fwd.clone().addScaledVector(rightV, dx).addScaledVector(up, dy).normalize();
    knifeRay.set(camera.position, dir);
    knifeRay.far = anim.range;
    const hit = knifeRay.intersectObjects(targets, true).find(h => h.object.isMesh);
    if (hit && (!best || (hit.object.userData.dummy && !best.object.userData.dummy) || hit.distance < best.distance - 0.3)) best = hit;
  }
  if (!best) return;
  const normal = best.face ? best.face.normal.clone().transformDirection(best.object.matrixWorld) : fwd.clone().negate();
  const dummy = best.object.userData.dummy;
  if (!dummy) {
    spawnConfetti(best.point, normal, best.object.material.color.getHex(), 6);
    return;
  }
  const u = dummy.userData;
  const facing = new THREE.Vector3(Math.sin(dummy.rotation.y), 0, Math.cos(dummy.rotation.y));
  const toDummy = dummy.position.clone().sub(player.position).setY(0).normalize();
  const backstab = facing.dot(toDummy) > 0.3;   // dummy faces away from us
  if (reportHit(dummy, backstab ? anim.back : anim.dmg, backstab, 'knife')) {
    if (u.team !== net.myTeam) { u.hitT = 0.15; spawnConfetti(best.point, normal, best.object.material.color.getHex(), 12); }
    return;
  }
  u.hp -= backstab ? anim.back : anim.dmg;
  u.hitT = 0.15;
  showHitmarker(backstab);
  spawnConfetti(best.point, normal, best.object.material.color.getHex(), 12);
  if (u.hp <= 0) {
    u.dead = true;
    u.deadT = 0;
    showKill(backstab ? 'BACKSTAB' : 'KNIFED');
  }
}

// ── WEAPON SLOTS (1 = AK, 3 = 기본칼) ──
const loadout = { current: 'rifle', next: null, phase: 'idle', h: 0 };
const SWITCH = { lower: 0.16, raise: 0.32 };
function requestWeapon(w) {

  loadout.next = w;
  loadout.phase = 'lower';
  cancelReload();
  knifeState.anim = null;
  knifeState.airQ = null;
}
document.addEventListener('keydown', e => {
  if (!isLocked) return;
  if (e.code === 'Digit1') {
    if (loadout.current === 'rifle' && loadout.phase === 'idle') cancelReload();   // tap your weapon key to cancel a reload
    else requestWeapon('rifle');
  }
  if (e.code === 'Digit3') requestWeapon('knife');
  if (e.code === 'KeyY' && loadout.current === 'knife' && loadout.phase === 'idle' && !knifeState.anim) startKnifeAnim('inspect');
});
function updateLoadout(dt) {
  if (loadout.phase === 'lower') {
    loadout.h = Math.min(1, loadout.h + dt / SWITCH.lower);
    if (loadout.h >= 1) {
      loadout.current = loadout.next;
      loadout.phase = 'raise';
      if (loadout.current === 'rifle') sfx.rifleRaise();
      // the knife has its own draw motion (traced from Valorant) instead of the generic raise
      if (loadout.current === 'knife') {
        loadout.h = 0;
        loadout.phase = 'idle';
        startKnifeAnim('draw', false);
      }
    }
  } else if (loadout.phase === 'raise') {
    loadout.h = Math.max(0, loadout.h - dt / SWITCH.raise);
    if (loadout.h <= 0) loadout.phase = 'idle';
  }
  viewmodelGroup.visible = loadout.current === 'rifle' && !player.dead;
  knifeRoot.visible = loadout.current === 'knife' && !player.dead;
}

function updateKnife(dt) {
  const ready = loadout.phase === 'idle';
  const cur = knifeState.anim;
  // free = nothing playing, inspecting, or a light swing past its combo point
  const free = !cur || cur.isInspect || (cur.nextAt !== undefined && knifeState.t >= cur.nextAt);
  if (ready && free) {
    if (ads.held) startKnifeAnim('heavy');
    else if (firing) { startKnifeAnim(knifeState.combo % 2 ? 'lightB' : 'lightA'); knifeState.combo++; }
  }
  let pose = { ...knifeIdle(), lp: LH_REST };
  const a = knifeState.anim;
  if (a) {
    knifeState.t += dt;
    if (a.hitAt !== undefined && !knifeState.hitDone && knifeState.t >= a.hitAt) {
      knifeState.hitDone = true;
      knifeStrike(a);
      if (a.streak) showStreak(a.streak);
      if (a.trail) {
        knifeTrail.position.set(...a.trail.pos);
        knifeTrail.rotation.set(0, 0, 0);
        knifeTrail.geometry.dispose();
        knifeTrail.geometry = new THREE.RingGeometry(a.trail.r0, a.trail.r1, 32, 1, a.trail.start, a.trail.len);
        trailT = 0.16;
      }
    }
    if (knifeState.t < a.dur) pose = sampleKnife(a, knifeState.t);
    if (knifeState.t >= a.dur) knifeState.anim = null;
  } else if (knifeState.combo && !firing) {
    knifeState.combo = 0;   // combo restarts at slash A after the hand settles
  }
  knifeState.last = { p: pose.p.slice(), r: pose.r.slice(), lp: pose.lp.slice() };
  trailT = Math.max(0, trailT - dt);
  trailMat.opacity = (trailT / 0.16) * 0.75;
  streakT = Math.max(0, streakT - dt);
  streakMat.opacity = Math.min(1, streakT / 0.2 * 1.4) * 0.85;

  const speedNow = Math.hypot(player.velocity.x, player.velocity.z);
  const time = performance.now() * 0.001;
  const moving = speedNow > 0.5 && player.isGrounded;
  const bobX = moving ? Math.sin(time * 12) * 0.012 : 0;
  const bobY = moving ? -Math.abs(Math.cos(time * 12)) * 0.01 : Math.sin(time * 1.5) * 0.003;
  knifeHand.position.set(pose.p[0], pose.p[1], pose.p[2]);
  knifeHand.rotation.set(pose.r[0], pose.r[1], pose.r[2]);
  knifeFist.visible = !pose.open;
  knifeOpenHand.visible = !!pose.open;
  if (pose.kp) {
    // tossed: flat side to the camera, blade angle ka (0 = up, counter-clockwise positive)
    knifeModel.position.set(pose.kp[0], pose.kp[1], pose.kp[2]);
    knifeModel.quaternion.setFromAxisAngle(_fzAxis, pose.ka).multiply(KNIFE_FLIP);
    if (pose.kt) knifeModel.quaternion.premultiply(_tiltQ.setFromAxisAngle(_fxAxis, pose.kt));   // flip toward the camera

    knifeState.airQ = knifeModel.quaternion.clone();
    knifeState.catchT = 0;
  } else {
    knifeModel.position.copy(knifeHand.position);
    knifeModel.quaternion.copy(knifeHand.quaternion).multiply(KNIFE_FLIP);
    const grip = KNIFE_SKINS[knifeSkin].grip;
    if (grip) knifeModel.quaternion.multiply(grip);
    // just caught: ease from the last in-air pose into the grip instead of snapping
    if (knifeState.airQ) {
      knifeState.catchT += dt;
      let u = Math.min(1, knifeState.catchT / KNIFE_CATCH_BLEND);

    }

  knifeRoot.position.set(KNIFE_ROOT[0] + bobX + vmSway.x, KNIFE_ROOT[1] + bobY + vmSway.y - 0.35 * loadout.h, KNIFE_ROOT[2]);
  knifeRoot.rotation.set(-vmSway.y * 2 - 0.8 * loadout.h, vmSway.x * 2, bobX * 1.5);
  poseKnifeForearm();
  poseKnifeLeft(pose.lp);
}

function updateShooting(dt) {
  if (!playerCanAct()) { firing = false; ads.held = false; }
  updateLoadout(dt);
  updateAds(dt);
  weapon.cooldown = Math.max(0, weapon.cooldown - dt);
  if (weapon.reloading > 0) {
    weapon.reloading -= dt;
    const p = 1 - weapon.reloading / weapon.reload.time;
    if (p >= weapon.reload.fillP) weapon.ammo = weapon.reloadFill;
    // CoD-style: once the gun is loaded, firing cancels the swing-back
    if (weapon.reloading <= 0) weapon.reloading = 0;
    else if (firing && p >= weapon.reload.readyP) cancelReload();   // past the rack: shooting cuts the swing-back
  }
  const rifleReady = loadout.current === 'rifle' && loadout.phase === 'idle';
  if (loadout.current === 'knife') updateKnife(dt);
  if (rifleReady && firing && weapon.cooldown <= 0 && weapon.reloading <= 0) {
    if (weapon.ammo > 0) {
      fireShot();
      weapon.cooldown = WEAPON.fireInterval;
    } else {
      sfx.dryFire();
      startReload();
    }
  }
  weapon.kick = Math.max(0, weapon.kick - dt * 12);
  applyPendingKick(dt);
  recoverRecoil(dt);
  if (recoil.sinceShot > RECOIL.sprayResetDelay) weapon.spray = Math.max(0, weapon.spray - RECOIL.sprayResetRate * dt);

  // crosshair gap = on-screen radius of the next shot's spread cone
  const spreadNext = currentSpread(Math.min(SPRAY.length - 1, Math.floor(weapon.spray)));
  const targetGap = loadout.current === 'knife' ? 4
    : Math.tan(spreadNext * Math.PI / 180) / Math.tan(camera.fov * Math.PI / 360) * (window.innerHeight / 2);
  crosshairGap += (Math.max(4, targetGap) - crosshairGap) * Math.min(1, dt * 18);
  crosshairEl.style.setProperty('--gap', crosshairGap.toFixed(1) + 'px');

  flashTimer -= dt;
  muzzleFlash.visible = flashTimer > 0;

  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i], u = c.userData;
    u.life -= dt;
    if (u.life <= 0) { scene.remove(c); confetti.splice(i, 1); continue; }
    u.v.y -= 9 * dt;
    u.v.multiplyScalar(1 - 2.5 * dt);
    c.position.addScaledVector(u.v, dt);
    c.rotation.x += u.spin.x * dt;
    c.rotation.y += u.spin.y * dt;
  }

  hitmarkerTimer -= dt;
  if (hitmarkerTimer <= 0) hitmarkerEl.classList.remove('show');
  killfeedTimer -= dt;
  if (killfeedTimer <= 0) killfeedEl.classList.remove('show');

  const knifeOut = loadout.current === 'knife';
  ammoCountEl.style.display = knifeOut ? 'none' : '';
  const knifeName = KNIFE_SKINS[knifeSkin].name;
  weaponNameEl.textContent = knifeOut ? knifeName : 'AK';
  slotHintEl.textContent = `1 AK · 3 ${knifeName}`;
  document.getElementById('ammo-cur').textContent = weapon.ammo;
  document.getElementById('reload-text').textContent = knifeOut ? '' : weapon.reloading > 0 ? 'RELOADING' : (weapon.ammo === 0 ? 'PRESS R' : '');
}

// ── RAYCASTER FOR GROUND/COLLISION ──
const raycaster = new THREE.Raycaster();

function getGroundHeight(x, z) {
  raycaster.set(new THREE.Vector3(x, 50, z), new THREE.Vector3(0, -1, 0));
  const meshes = mapMeshes();
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) return hits[0].point.y;
  return 0;
}

function checkAABBCollision(pos, radius) {
  let corrected = pos.clone();
  for (const obs of obstacles) {
    const closest = new THREE.Vector3(
      Math.max(obs.min.x, Math.min(corrected.x, obs.max.x)),
      Math.max(obs.min.y, Math.min(corrected.y + player.height * 0.5, obs.max.y)),
      Math.max(obs.min.z, Math.min(corrected.z, obs.max.z)),
    );
    const diff = new THREE.Vector3(corrected.x - closest.x, 0, corrected.z - closest.z);
    const dist = diff.length();
    if (dist < radius && dist > 0.001) {
      const push = diff.normalize().multiplyScalar(radius - dist);
      corrected.x += push.x;
      corrected.z += push.z;
    }
  }
  return corrected;
}

// ── CAMERA COLLISION ──
function cameraCollisionCheck(from, to, maxDist) {
  const dir = to.clone().sub(from).normalize();
  raycaster.set(from, dir);
  raycaster.far = maxDist;
  const meshes = mapMeshes();
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0 && hits[0].distance < maxDist) {
    return hits[0].distance - CONFIG.cameraCollisionRadius;
  }
  return maxDist;
}

// ── GAME LOOP ──
const clock = new THREE.Clock();
let frameCount = 0;
let fps = 0;
let fpsTimer = 0;

function update(dt) {
  if (!isLocked) return;

  // ── Camera rotation from mouse ──
  // scale with zoom so aiming in ADS feels the same on screen
  const sensScale = Math.tan(camera.fov * Math.PI / 360) / Math.tan(CONFIG.fov * Math.PI / 360);
  const lookYaw = -mouse.dx * CONFIG.sensitivity * 0.07 * sensScale;
  const lookPitch = -mouse.dy * CONFIG.sensitivity * 0.07 * sensScale * (CONFIG.invertY ? -1 : 1);
  cam.yaw += lookYaw;
  cam.pitch += lookPitch;
  cam.pitch = Math.max(CONFIG.cameraMinPitch, Math.min(CONFIG.cameraMaxPitch, cam.pitch));
  compensateRecoil(lookPitch, lookYaw);
  vmSway.x += (-mouse.dx * 0.0004 - vmSway.x) * Math.min(1, dt * 10);
  vmSway.y += (mouse.dy * 0.0004 - vmSway.y) * Math.min(1, dt * 10);
  vmSway.x = Math.max(-0.05, Math.min(0.05, vmSway.x));
  vmSway.y = Math.max(-0.05, Math.min(0.05, vmSway.y));
  mouse.dx = 0;
  mouse.dy = 0;

  // ── Movement input ──
  const forward = new THREE.Vector3(Math.sin(cam.yaw * Math.PI / 180), 0, Math.cos(cam.yaw * Math.PI / 180));
  const right = new THREE.Vector3(-forward.z, 0, forward.x);

  let moveDir = new THREE.Vector3(0, 0, 0);
  if (keys['KeyW']) moveDir.add(forward);
  if (keys['KeyS']) moveDir.sub(forward);
  if (keys['KeyD']) moveDir.add(right);
  if (keys['KeyA']) moveDir.sub(right);

  if (moveDir.length() > 0.01) moveDir.normalize();
  const canAct = playerCanAct();   // frozen during the round countdown and while dead
  if (!canAct) moveDir.set(0, 0, 0);

  // ── Dodge roll (Shift) ──
  player.dodgeCooldownTimer = Math.max(0, player.dodgeCooldownTimer - dt);

  if (canAct && keys['ShiftLeft'] && player.isGrounded && !player.isDodging && player.dodgeCooldownTimer <= 0) {
    player.isDodging = true;
    sfx.dodge();
    cancelReload();
    player.dodgeTimer = CONFIG.dodgeDuration;
    const dodgeDirMap = { KeyW: forward.clone(), KeyS: forward.clone().negate(), KeyD: right.clone(), KeyA: right.clone().negate() };
    player.dodgeDirection = dodgeDirMap[lastMoveKey] || forward.clone();
    keys['ShiftLeft'] = false;
  }

  if (player.isDodging) {
    player.dodgeTimer -= dt;
    if (player.dodgeTimer <= 0) {
      player.isDodging = false;
      player.dodgeTimer = 0;
      player.dodgeCooldownTimer = CONFIG.dodgeCooldown;
    }
    const dodgeProgress = 1 - (player.dodgeTimer / CONFIG.dodgeDuration);
    // ease in over the first 20%, ease out back to walk speed (no instant jolt either way)
    const dodgeSpeedCurve = dodgeProgress < 0.2
      ? Math.sin((dodgeProgress / 0.2) * Math.PI * 0.5)
      : Math.cos(((dodgeProgress - 0.2) / 0.8) * Math.PI * 0.5);
    const dodgeSpeedNow = CONFIG.walkSpeed + (CONFIG.dodgeSpeed - CONFIG.walkSpeed) * dodgeSpeedCurve;
    player.velocity.x = player.dodgeDirection.x * dodgeSpeedNow;
    player.velocity.z = player.dodgeDirection.z * dodgeSpeedNow;

  } else {

    if (player.isGrounded) {
      // Ground: apply friction then accelerate
      const speed = Math.sqrt(player.velocity.x * player.velocity.x + player.velocity.z * player.velocity.z);
      // friction only when coasting; with input the accel lerp alone sets top speed = walkSpeed
      if (speed > 0.1 && moveDir.lengthSq() < 0.0001) {
        const drop = speed * (1 - CONFIG.groundFriction) * 60 * dt;
        const factor = Math.max(0, (speed - drop)) / speed;
        player.velocity.x *= factor;
        player.velocity.z *= factor;
      }
      const weaponSpeedMul = loadout.current === 'knife' ? KNIFE.speedMul : 1;
      const targetSpeed = CONFIG.walkSpeed * weaponSpeedMul * (1 + (ADS.speedMul - 1) * adsEase());
      const accel = CONFIG.groundAccel;
      const targetVelX = moveDir.x * targetSpeed;
      const targetVelZ = moveDir.z * targetSpeed;
      player.velocity.x += (targetVelX - player.velocity.x) * Math.min(1, accel * dt);
      player.velocity.z += (targetVelZ - player.velocity.z) * Math.min(1, accel * dt);
    } else {
      // Air: Source-engine style air strafing (enables bhop)
      if (moveDir.length() > 0.01) {
        const wishDir = moveDir.clone().normalize();
        const currentSpeed = player.velocity.x * wishDir.x + player.velocity.z * wishDir.z;
        const addSpeed = Math.max(0, CONFIG.walkSpeed * 0.9 - currentSpeed);
        const accelAmount = Math.min(CONFIG.airAccel * CONFIG.walkSpeed * dt, addSpeed);
        player.velocity.x += wishDir.x * accelAmount;
        player.velocity.z += wishDir.z * accelAmount;
      }
    }
  }

  // ── Gravity ──
  player.velocity.y += CONFIG.gravity * dt;

  // ── Jump (bhop: auto-jump while holding space) ──
  if (canAct && keys['Space'] && player.isGrounded && !player.isDodging) {
    player.velocity.y = CONFIG.jumpForce;
    sfx.jump();
    player.isGrounded = false;
  }

  // ── Apply velocity ──
  player.position.x += player.velocity.x * dt;
  player.position.z += player.velocity.z * dt;
  player.position.y += player.velocity.y * dt;

  // ── Ground check ──
  const groundY = getGroundHeight(player.position.x, player.position.z);
  const wasGrounded = player.isGrounded;
  const fallSpeed = -player.velocity.y;
  if (player.position.y <= groundY) {
    player.position.y = groundY;
    player.velocity.y = 0;
    player.isGrounded = true;
    if (!wasGrounded && fallSpeed > 3) sfx.land();
  } else {
    player.isGrounded = false;
  }

  // footsteps: one per stride of ground covered
  const groundSpeed = Math.hypot(player.velocity.x, player.velocity.z);
  if (player.isGrounded && !player.isDodging && groundSpeed > 1.5) {
    stepDistance += groundSpeed * dt;
    if (stepDistance > 2.3) { stepDistance = 0; sfx.step(0.22 + Math.min(0.15, groundSpeed * 0.015)); }
  } else if (player.isGrounded) {
    stepDistance = 1.6;   // the first step after starting to move comes quickly
  }

  // ── Obstacle collision ──
  player.position = checkAABBCollision(player.position, player.radius);

  // ── Boundary ──
  const [bx, bz] = MAPS[currentMap].bound;
  player.position.x = Math.max(-bx, Math.min(bx, player.position.x));
  player.position.z = Math.max(-bz, Math.min(bz, player.position.z));

  // ── Update player visual ──
  playerGroup.position.copy(player.position);

  // Hide player sprite in first person
  charMesh.visible = false;

  const tNow = performance.now() * 0.001;
  for (const d of dummies) {
    const u = d.userData;
    if (u.remoteId) continue;   // other players are driven by updateNet
    u.hitT = Math.max(0, u.hitT - dt);
    const squash = u.hitT > 0 ? 1 + u.hitT * 1.5 : 1;
    d.scale.set(squash, 2 - squash, 1);
    if (u.dead) {
      u.deadT += dt;
      d.rotation.x = -(Math.min(1, u.deadT / 0.35) ** 2) * Math.PI / 2;
      if (u.deadT > 3) {
        u.dead = false;
        u.hp = 100;
        d.rotation.x = 0;
      }
      continue;
    }
    if (u.walks) {
      const px = d.position.x, pz = d.position.z;
      d.position.x = u.origin.x + Math.sin(tNow * 0.6 + u.phase) * 3;
      d.position.z = u.origin.z + Math.cos(tNow * 0.4 + u.phase) * 2;
      d.rotation.y = Math.atan2(d.position.x - px, d.position.z - pz);
    } else {
      d.rotation.y = Math.atan2(player.position.x - d.position.x, player.position.z - d.position.z);
    }
    animateDummy(d, tNow, u.walks);
  }
  playerGroup.position.copy(player.position);

  // ── FPS Camera ──
  const yawRad = cam.yaw * Math.PI / 180;
  const pitchRad = cam.pitch * Math.PI / 180;

  const eyePos = new THREE.Vector3(
    player.position.x,
    player.position.y + 1.6,
    player.position.z,
  );

  camera.position.copy(eyePos);
  const lookDir = new THREE.Vector3(
    Math.sin(yawRad) * Math.cos(pitchRad),
    Math.sin(pitchRad),
    Math.cos(yawRad) * Math.cos(pitchRad),
  );
  camera.lookAt(eyePos.clone().add(lookDir));

  updateShooting(dt);

  // ── Viewmodel (arms + gun) ──
  const speed = Math.sqrt(player.velocity.x * player.velocity.x + player.velocity.z * player.velocity.z);
  const time = performance.now() * 0.001;
  const moving = speed > 0.5 && player.isGrounded;
  const bobX = moving ? Math.sin(time * 12) * 0.014 : 0;
  const bobY = moving ? -Math.abs(Math.cos(time * 12)) * 0.012 : Math.sin(time * 1.5) * 0.003;
  const airY = player.isGrounded ? 0 : Math.max(-0.03, Math.min(0.03, -player.velocity.y * 0.003));
  const ae = adsEase();
  const motionK = 1 - 0.85 * ae; // bob/sway mostly suppressed while aiming
  const lerp = (a, b) => a + (b - a) * ae;
  viewmodelGroup.position.set(
    lerp(VM_BASE.x, ADS.pos.x) + (bobX + vmSway.x) * motionK,
    lerp(VM_BASE.y, ADS.pos.y) + (bobY + airY + vmSway.y) * motionK,
    lerp(VM_BASE.z, ADS.pos.z) + weapon.kick * 0.05 * (1 - 0.5 * ae),
  );
  viewmodelGroup.rotation.set(
    VM_ROT.x * (1 - ae) - vmSway.y * 2 * motionK + weapon.kick * 0.06 * (1 - 0.6 * ae),
    VM_ROT.y * (1 - ae) + vmSway.x * 2 * motionK,
    VM_ROT.z * (1 - ae) + bobX * 1.5 * motionK,
  );
  const rk = currentReloadPose(dt);
  chargingHandle.position.z = -0.18 + rk.ch;
  gun.rotation.set(rk.gr[0], rk.gr[1], rk.gr[2]);
  gun.position.set(rk.gp[0], rk.gp[1], rk.gp[2]);
  magGroup.position.set(rk.mag[0], rk.mag[1], rk.mag[2]);
  leftArm.position.set(rk.lh[0], rk.lh[1], rk.lh[2]);
  poseLeftForearm(rk.lh, rk.el);
  if (player.isDodging) {
    viewmodelGroup.position.y -= 0.12;
    viewmodelGroup.rotation.z += 0.35;
  }
  viewmodelGroup.position.y -= 0.35 * loadout.h;
  viewmodelGroup.rotation.x -= 0.8 * loadout.h;

  // ── HUD ──
  const spd = Math.sqrt(player.velocity.x ** 2 + player.velocity.z ** 2);
  document.getElementById('speed').textContent = spd.toFixed(1);
  const dodgeIndicator = document.getElementById('sprint-indicator');
  if (player.isDodging) {
    dodgeIndicator.style.display = 'block';
    dodgeIndicator.textContent = 'DODGE';
  } else if (player.dodgeCooldownTimer > 0) {
    dodgeIndicator.style.display = 'block';
    dodgeIndicator.textContent = `DODGE (${player.dodgeCooldownTimer.toFixed(1)}s)`;
    dodgeIndicator.style.color = '#888';
  } else {
    dodgeIndicator.style.display = 'none';
    dodgeIndicator.style.color = '#ffcc00';
  }

  // ── FPS ──
  frameCount++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fps = Math.round(frameCount / fpsTimer);
    frameCount = 0;
    fpsTimer = 0;
  }
  document.getElementById('debug-info').textContent =
    `FPS: ${fps} | Pos: ${player.position.x.toFixed(1)}, ${player.position.y.toFixed(1)}, ${player.position.z.toFixed(1)} | Grounded: ${player.isGrounded}`;
}

// ── ONLINE MATCH (1v1 / 2v2, first to 5) ── server.js owns rounds, HP and deaths; this client sends its
// own movement/shots, reports hits on others, and draws everyone else from 20 Hz snapshots.
const net = {
  peer: null, conn: null, hostRoom: null, send: null,   // P2P transport (see hostRoom / joinRoom)
  id: null, mode: 'menu',                    // 'menu' | 'practice' | 'lobby' | 'online'
  room: null, host: null, players: [],       // lobby info
  phase: 'lobby', round: 0, score: { blue: 0, red: 0 }, timer: 0, myTeam: 'blue',
  remotes: new Map(),                        // id -> { avatar, buf, team, name, hp, dead, label }
  sendT: 0,
};
const INTERP_DELAY = 0.1;
const tagRay = new THREE.Raycaster(), _tagFrom = new THREE.Vector3(), _tagTo = new THREE.Vector3();   // render others 100 ms in the past so there are always two snapshots to blend
const practiceDummies = dummies.slice();
camera.position.set(0, 1.6, 0);   // menu backdrop: stand in the arena instead of the default camera pose
camera.lookAt(0, 1.6, 10);

// ── P2P: the room creator's browser IS the server (same rules/messages as server.js); everyone else connects
// to it directly with WebRTC. PeerJS's free public broker is only used so players can find each other by code.
const PEER_PREFIX = 'chanchan-fps-v1-';
const RULES = { winScore: 5, prestart: 3, roundTime: 100, post: 3, maxHit: 150 };
const MODES = { '1v1': 1, '2v2': 2 };   // players per team
const SPAWNS = {
  blue: [[-3, -24, 0], [3, -24, 0]],     // [x, z, yaw°]; yaw 0 faces +z
  red: [[3, 24, 180], [-3, 24, 180]],
};
// 폭탄전 (Wingman-style): sides swap every round, first to 5 still wins
const BOMB = { roundTime: 60, fuse: 35, plantTime: 3, defuseTime: 5, defuseRange: 2.2, pickupRange: 1.4 };
const BOMB_SPAWNS = {
  attack: [[-2, -21, 0], [2, -21, 0]],
  defense: [[-2, 21.5, 180], [2, 21.5, 180]],
};
// which site (if any) a position is inside
const inSite = (x, z) => (BOMB_SITES.find(st => Math.abs(x - st.x) <= st.hw + 0.3 && Math.abs(z - st.z) <= st.hd + 0.3) || {}).name || null;
const makeRoomCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');

// host-side room: one room per host browser. clients: id -> send(msg)
function createHostRoom(code, mode, type = 'elim') {
  const room = { code, mode, type, players: new Map(), host: 1, phase: 'lobby', round: 0, score: { blue: 0, red: 0 }, timer: 0, nextId: 1,
    attack: null, bomb: null };
  const isBomb = type === 'bomb';
  const sendTo = (p, msg) => { try { p.send(msg); } catch (e) { /* peer gone */ } };
  const broadcast = (msg, exceptId) => { for (const p of room.players.values()) if (p.id !== exceptId) sendTo(p, msg); };
  const teamOf = team => [...room.players.values()].filter(p => p.team === team);
  const lobbyInfo = () => ({ t: 'lobby', room: room.code, mode: room.mode, type: room.type, host: room.host, phase: room.phase, score: room.score,
    players: [...room.players.values()].map(p => ({ id: p.id, name: p.name, team: p.team })) });

  function startRound() {
    room.round += 1; room.phase = 'prestart'; room.timer = RULES.prestart;
    // bomb mode: blue attacks on odd rounds, red on even rounds
    room.attack = isBomb ? (room.round % 2 ? 'blue' : 'red') : null;
    const spawns = {};
    for (const team of ['blue', 'red']) {
      const list = isBomb ? BOMB_SPAWNS[team === room.attack ? 'attack' : 'defense'] : SPAWNS[team];
      teamOf(team).forEach((p, i) => {
        const s = list[i % list.length];
        p.hp = 100; p.dead = false; p.act = null; p.actT = 0;
        p.state = { p: [s[0], 0, s[1]], yaw: s[2], pitch: 0, w: 'rifle' };
        spawns[p.id] = s;
      });
    }
    if (isBomb) {
      const atk = teamOf(room.attack);
      room.bomb = { s: 'carried', c: atk[Math.floor(Math.random() * atk.length)].id, p: null };
    }
    broadcast({ t: 'round', phase: 'prestart', round: room.round, score: room.score, timer: room.timer, spawns,
      type: room.type, map: isBomb ? 'bomb' : 'arena', attack: room.attack });
  }
  const defense = () => room.attack === 'blue' ? 'red' : 'blue';
  // the carrier died or left: the bomb falls where they stood
  function dropBomb(p) {
    if (!room.bomb || room.bomb.s !== 'carried' || room.bomb.c !== p.id) return;
    room.bomb = { s: 'dropped', c: null, p: [p.state.p[0], 0, p.state.p[2]] };
    broadcast({ t: 'bomb', ev: 'drop', id: p.id });
  }
  function endRound(winner, reason) {
    if (room.phase !== 'live') return;
    for (const p of room.players.values()) { p.act = null; p.actT = 0; }
    if (winner) room.score[winner] += 1;
    room.phase = 'post'; room.timer = RULES.post;
    broadcast({ t: 'round', phase: 'post', round: room.round, score: room.score, winner, reason, timer: room.timer });
  }
  function endMatch(winner) {
    broadcast({ t: 'end', winner, score: room.score });
    room.phase = 'lobby';
    broadcast(lobbyInfo());
  }
  function checkRoundOver() {
    if (room.phase !== 'live') return;
    const b = teamOf('blue').filter(p => !p.dead).length, r = teamOf('red').filter(p => !p.dead).length;
    if (isBomb) {
      const alive = { blue: b, red: r };
      if (alive[defense()] === 0) endRound(room.attack, 'elim');                                   // defenders dead: attack wins
      else if (alive[room.attack] === 0 && room.bomb.s !== 'planted') endRound(defense(), 'elim');   // after the plant they must defuse
      return;
    }
    if (b === 0 || r === 0) endRound(b > 0 ? 'blue' : r > 0 ? 'red' : null, 'elim');
  }
  // plant / defuse: held on the client (E), timed here so nobody can skip the wait
  function tickBomb(dt) {
    const bomb = room.bomb;
    if (bomb.s === 'dropped') {
      for (const p of teamOf(room.attack)) {
        if (!p.dead && Math.hypot(p.state.p[0] - bomb.p[0], p.state.p[2] - bomb.p[2]) < BOMB.pickupRange) {
          room.bomb = { s: 'carried', c: p.id, p: null };
          broadcast({ t: 'bomb', ev: 'pickup', id: p.id });
          break;
        }
      }
    }
    for (const p of room.players.values()) {
      const [x, , z] = p.state.p;
      const ok = !p.dead && (
        p.act === 'plant' ? p.team === room.attack && room.bomb.s === 'carried' && room.bomb.c === p.id && inSite(x, z) :
        p.act === 'defuse' ? p.team !== room.attack && room.bomb.s === 'planted' && Math.hypot(x - room.bomb.p[0], z - room.bomb.p[2]) < BOMB.defuseRange :
        false);
      if (!ok) { p.actT = 0; continue; }
      p.actT += dt;
      if (p.act === 'plant' && p.actT >= BOMB.plantTime) {
        room.bomb = { s: 'planted', c: null, p: [x, 0, z], site: inSite(x, z) };
        room.timer = BOMB.fuse;
        p.act = null; p.actT = 0;
        broadcast({ t: 'bomb', ev: 'plant', id: p.id, p: room.bomb.p, site: room.bomb.site });
      } else if (p.act === 'defuse' && p.actT >= BOMB.defuseTime) {
        room.bomb.s = 'defused';
        broadcast({ t: 'bomb', ev: 'defuse', id: p.id });
        endRound(defense(), 'defuse');
        return;
      }
    }
  }
  function tick(dt) {
    if (room.phase === 'lobby') return;
    room.timer -= dt;
    if (room.phase === 'prestart' && room.timer <= 0) {
      room.phase = 'live'; room.timer = isBomb ? BOMB.roundTime : RULES.roundTime;
      broadcast({ t: 'round', phase: 'live', round: room.round, score: room.score, timer: room.timer });
    } else if (room.phase === 'live' && isBomb) {
      tickBomb(dt);
      if (room.phase === 'live' && room.timer <= 0) {
        if (room.bomb.s === 'planted') {
          room.bomb.s = 'exploded';
          broadcast({ t: 'bomb', ev: 'explode', p: room.bomb.p });
          endRound(room.attack, 'bomb');
        } else endRound(defense(), 'time');   // no plant in time: defense wins
      }
    } else if (room.phase === 'live' && room.timer <= 0) {
      const alive = t => teamOf(t).filter(p => !p.dead);
      const hp = t => alive(t).reduce((s, p) => s + p.hp, 0);
      const b = alive('blue').length, r = alive('red').length;
      endRound(b !== r ? (b > r ? 'blue' : 'red') : hp('blue') !== hp('red') ? (hp('blue') > hp('red') ? 'blue' : 'red') : null, 'time');
    } else if (room.phase === 'post' && room.timer <= 0) {
      const w = room.score.blue >= RULES.winScore ? 'blue' : room.score.red >= RULES.winScore ? 'red' : null;
      if (w) endMatch(w); else startRound();
    }
    broadcast({ t: 'snap', timer: room.timer, phase: room.phase, bomb: room.bomb,
      ps: [...room.players.values()].map(p => ({ id: p.id, ...p.state, hp: p.hp, dead: p.dead, act: p.actT > 0 ? p.act : null })) });
  }
  function addPlayer(send) {
    const id = room.nextId++;
    room.players.set(id, { id, send, name: 'player', team: 'blue', hp: 100, dead: false, state: { p: [0, 0, 0], yaw: 0, pitch: 0, w: 'rifle' }, joined: false });
    return id;
  }
  function leave(id) {
    const gone = room.players.get(id);
    if (gone && room.phase !== 'lobby') dropBomb(gone);
    if (!room.players.delete(id)) return;
    broadcast({ t: 'left', id });
    if (room.phase !== 'lobby') {
      const b = teamOf('blue').length, r = teamOf('red').length;
      if (b === 0 || r === 0) return endMatch(b > 0 ? 'blue' : 'red');
      checkRoundOver();
    }
    broadcast(lobbyInfo());
  }
  function handle(id, m) {
    const me = room.players.get(id);
    if (!me || !m || typeof m.t !== 'string') return;
    if (m.t === 'create' || m.t === 'join') {
      if (me.joined) return;
      if (m.t === 'join' && String(m.room || '').toUpperCase() !== room.code) return sendTo(me, { t: 'error', msg: '방을 찾을 수 없어요' });
      if (teamOf('blue').filter(p => p.joined).length + teamOf('red').filter(p => p.joined).length >= MODES[room.mode] * 2) {
        sendTo(me, { t: 'error', msg: '방이 꽉 찼어요' }); return room.players.delete(id);
      }
      if (room.phase !== 'lobby') { sendTo(me, { t: 'error', msg: '이미 경기 중인 방이에요' }); return room.players.delete(id); }
      me.joined = true;
      me.name = String(m.name || 'player').slice(0, 12) || 'player';
      me.team = teamOf('blue').filter(p => p.joined && p !== me).length <= teamOf('red').filter(p => p.joined && p !== me).length ? 'blue' : 'red';
      sendTo(me, { t: 'welcome', id });
      broadcast(lobbyInfo());
      return;
    }
    switch (m.t) {
      case 'team':
        if (room.phase === 'lobby' && (m.team === 'blue' || m.team === 'red') && teamOf(m.team).length < MODES[room.mode]) {
          me.team = m.team; broadcast(lobbyInfo());
        }
        break;
      case 'start':
        if (id !== room.host || room.phase !== 'lobby') return;
        if (!teamOf('blue').length || !teamOf('red').length) return sendTo(me, { t: 'error', msg: '양 팀에 최소 1명씩 있어야 해요' });
        room.score = { blue: 0, red: 0 }; room.round = 0;
        startRound();
        break;
      case 'state':
        if (room.phase === 'lobby' || me.dead || !Array.isArray(m.p)) return;
        me.state = { p: m.p.slice(0, 3).map(Number), yaw: +m.yaw || 0, pitch: +m.pitch || 0, w: m.w === 'knife' ? 'knife' : 'rifle', ads: !!m.ads };
        { const act = m.act === 'plant' || m.act === 'defuse' ? m.act : null;
          if (act !== me.act) { me.act = act; me.actT = 0; } }
        break;
      case 'shot':
        if (room.phase === 'live' && !me.dead) broadcast({ t: 'shot', id, o: m.o, e: m.e }, id);
        break;
      case 'anim':
        if (!me.dead) broadcast({ t: 'anim', id, name: String(m.name || '') }, id);
        break;
      case 'hit': {
        const target = room.players.get(m.target);
        if (room.phase !== 'live' || me.dead || !target || target.dead || target.team === me.team) return;
        const dmg = Math.max(0, Math.min(RULES.maxHit, Number(m.dmg) || 0));
        target.hp -= dmg;
        broadcast({ t: 'hp', id: target.id, hp: Math.max(0, target.hp), by: id, head: !!m.head });
        if (target.hp <= 0) {
          target.dead = true;
          target.act = null; target.actT = 0;
          dropBomb(target);
          broadcast({ t: 'kill', killer: id, victim: target.id, head: !!m.head, w: m.w === 'knife' ? 'knife' : 'rifle' });
          checkRoundOver();
        }
        break;
      }
    }
  }
  let last = performance.now();
  const timer = setInterval(() => { const now = performance.now(); tick((now - last) / 1000); last = now; }, 50);
  return { code, handle, addPlayer, leave, stop: () => clearInterval(timer) };
}

// ── transports ──
function netError(msg) {
  if (net.mode === 'lobby') $('lobby-msg').textContent = msg; else $('menu-error').textContent = msg;
}
function hostRoom(mode, type, attempt = 0) {
  if (typeof Peer === 'undefined') return netError('연결 라이브러리를 불러오지 못했어요 (인터넷 확인)');
  const code = makeRoomCode();
  const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
  net.peer = peer;
  $('menu-error').textContent = '방 여는 중…';
  peer.on('open', () => {
    const room = createHostRoom(code, mode, type);
    net.hostRoom = room;
    // the host plays through a local loopback (async, like a real connection)
    const myId = room.addPlayer(msg => queueMicrotask(() => onNetMessage(msg)));
    net.send = msg => room.handle(myId, msg);
    $('menu-error').textContent = '';
    net.send({ t: 'create', name: playerName(), mode });
    peer.on('connection', conn => {
      conn.on('open', () => {
        const id = room.addPlayer(msg => conn.open && conn.send(msg));
        conn.on('data', m => room.handle(id, m));
        conn.on('close', () => room.leave(id));
        conn.on('error', () => room.leave(id));
      });
    });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id' && attempt < 5) { peer.destroy(); return hostRoom(mode, type, attempt + 1); }   // code taken: pick another
    netError('방을 열 수 없어요 (' + err.type + ')');
  });
  peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); });   // keep the code reachable for late joiners
}
function joinRoom(code) {
  if (typeof Peer === 'undefined') return netError('연결 라이브러리를 불러오지 못했어요 (인터넷 확인)');
  const peer = new Peer({ debug: 0 });
  net.peer = peer;
  $('menu-error').textContent = '방장에게 연결 중…';
  const giveUp = setTimeout(() => {
    if (net.mode === 'menu') { netError('방장 컴퓨터에 연결할 수 없어요 (네트워크가 P2P를 막고 있을 수 있어요)'); peer.destroy(); }
  }, 12000);
  peer.on('open', () => {
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
    net.conn = conn;
    conn.on('open', () => {
      clearTimeout(giveUp);
      $('menu-error').textContent = '';
      net.send = msg => { if (conn.open) conn.send(msg); };
      net.send({ t: 'join', name: playerName(), room: code });
    });
    conn.on('data', m => { try { onNetMessage(m); } catch (e) { console.error(e); } });
    conn.on('close', () => {
      if (net.conn !== conn) return;
      if (net.mode === 'lobby' || net.mode === 'online') { leaveOnline(); $('menu-error').textContent = '방장이 나갔거나 연결이 끊겼어요'; }
    });
  });
  peer.on('error', err => {
    clearTimeout(giveUp);
    netError(err.type === 'peer-unavailable' ? '방을 찾을 수 없어요 (코드 확인)' : '연결 실패 (' + err.type + ')');
  });
}
function closeTransport() {
  if (net.hostRoom) { net.hostRoom.stop(); net.hostRoom = null; }
  const conn = net.conn; net.conn = null;
  if (conn) conn.close();
  if (net.peer) { net.peer.destroy(); net.peer = null; }
  net.send = null;
}
const netSend = msg => { if (net.send) net.send(msg); };

// ── avatars for other players: the paper dummy holding a paper AK, with a floating name tag ──
function makeNameTag(name, team) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,0.7)'; g.strokeText(name, 128, 32);
  g.fillStyle = team === 'blue' ? '#9cc1ff' : '#ff9d95'; g.fillText(name, 128, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(1.2, 0.3, 1);
  s.position.y = 2.25;
  s.raycast = () => {};   // name tags never block bullets (sprites also need a camera to raycast)
  return s;
}
function makeAvatar(p) {
  const d = createDummy(p.team);
  const gun = new THREE.Group();
  part(gun, 0.06, 0.09, 0.62, 0x2e2c2a, 0, 0, 0.12);                       // receiver + barrel
  part(gun, 0.05, 0.12, 0.06, C.mag, 0, -0.09, 0.14, 0.25);                 // magazine
  part(gun, 0.05, 0.08, 0.22, C.wood, 0, -0.02, -0.25);                     // stock
  gun.position.set(0, -0.5, 0.05);
  gun.rotation.x = Math.PI / 2;      // the arm points forward, so the gun lines up with it
  d.userData.armR.add(gun);
  const flash = new THREE.Mesh(new THREE.CircleGeometry(0.12, 8), new THREE.MeshBasicMaterial({ color: 0xffe066, side: THREE.DoubleSide }));
  flash.position.set(0, -0.5, 0.5);
  flash.rotation.x = Math.PI / 2;
  flash.visible = false;
  flash.raycast = () => {};
  d.userData.armR.add(flash);
  gun.traverse(o => { if (o.isMesh) o.userData.dummy = d; });   // hitting their gun counts as a body hit
  d.userData.tag = makeNameTag(p.name, p.team);
  d.add(d.userData.tag);
  d.userData.remoteId = p.id;
  d.userData.team = p.team;
  d.userData.gun = gun;
  d.userData.flash = flash;
  d.userData.flashT = 0;
  scene.add(d);
  return d;
}
function clearRemotes() {
  for (const r of net.remotes.values()) scene.remove(r.avatar);
  net.remotes.clear();
}
function syncRemotes() {
  for (const p of net.players) {
    if (p.id === net.id || net.remotes.has(p.id)) continue;
    const avatar = makeAvatar(p);
    net.remotes.set(p.id, { avatar, buf: [], team: p.team, name: p.name, hp: 100, dead: false });
  }
  for (const [id, r] of net.remotes) {
    if (!net.players.some(p => p.id === id)) { scene.remove(r.avatar); net.remotes.delete(id); }
  }
  // remote avatars are the only shootable targets online
  dummies.length = 0;
  for (const r of net.remotes.values()) dummies.push(r.avatar);
}
const remoteName = id => id === net.id ? '나' : (net.remotes.get(id) || {}).name || '?';
const remoteTeam = id => id === net.id ? net.myTeam : (net.remotes.get(id) || {}).team;
